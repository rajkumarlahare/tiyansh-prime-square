<meta name="theme-color" content="#050914">
<title>Tiyansh — The Prime Square</title>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const generic = Boolean(params.get('projectId') || params.get('projectSlug') || /^\/p\//.test(location.pathname));
  if (generic) {
    document.documentElement.classList.add('rekixo-project-loading');
    document.title = 'Project';
  }
})();
</script>

.view-mode:hover{border-color:#344867}.mini-logo{right:19px;top:22px;width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#fff,#dce3ee);color:#111a2d;border:2px solid #fff;box-shadow:0 8px 24px #0008,0 0 0 2px #20c97955;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}.mini-logo strong{font-size:12px;letter-spacing:.02em}.mini-logo span{margin-top:3px;color:#207956;font-size:8px;font-weight:950;letter-spacing:.08em}

.status-body{position:absolute;left:0;bottom:calc(100% + 6px);width:100%;max-height:0;opacity:0;overflow:hidden;pointer-events:none;padding:0 10px;background:transparent;border:0;box-shadow:none;transform:translateY(18px) scale(.94);transform-origin:bottom center;filter:blur(3px);transition:max-height .42s cubic-bezier(.22,1,.36,1),opacity .25s ease,transform .42s cubic-bezier(.22,1,.36,1),filter .25s ease;will-change:transform,opacity}.status.expanded .status-body{max-height:190px;opacity:1;overflow:visible;pointer-events:auto;transform:translateY(0) scale(1);filter:blur(0)}.status-line{width:100%;margin-top:12px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 4px #000,0 0 8px #000}.status-line b{font-size:12px}.status-option{appearance:none;border:0;background:transparent;padding:7px 7px;margin-left:-4px;margin-right:-4px;border-radius:9px;text-align:left;cursor:pointer;opacity:0;transform:translateY(12px);transition:background .15s,transform .38s cubic-bezier(.22,1,.36,1),opacity .25s ease}.status.expanded .status-option{opacity:1;transform:translateY(0)}.status.expanded .status-option:nth-child(1){transition-delay:.04s}.status.expanded .status-option:nth-child(2){transition-delay:.09s}.status.expanded .status-option:nth-child(3){transition-delay:.14s}.status-option:active{transform:scale(.985)}.status-option.active{background:transparent}.status-option:focus-visible{outline:2px solid #7aa7ff;outline-offset:1px}.status-option.available b{color:#21df82}.status-option.booked b{color:#ffd044}.status-option.sold b{color:#ff5a72}
.status-line b{color:#697794;font-size:12px}.status-line.total{padding-top:10px;border-top:1px solid #263149;color:#697794}.status-line.total b{color:#ffd900;font-size:18px}.sdot{width:11px;height:11px;border:2px solid currentColor;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-1px}.available{color:#15c86d}.booked{color:#f5b716}.sold{color:#f23b56}
.status-option.available b{color:#21df82}.status-option.booked b{color:#ffd044}.status-option.sold b{color:#ff5a72}
.status-filter-available .plot[data-status="available"]{fill:rgba(20,196,105,.28);stroke:rgba(28,239,129,.72);stroke-width:1}.status-filter-booked .plot[data-status="booked"]{fill:rgba(245,181,22,.29);stroke:rgba(255,203,44,.82);stroke-width:1}.status-filter-sold .plot[data-status="sold"]{fill:rgba(240,49,76,.30);stroke:rgba(255,70,94,.86);stroke-width:1}.status-filter-available .plot:not([data-status="available"]),.status-filter-booked .plot:not([data-status="booked"]),.status-filter-sold .plot:not([data-status="sold"]){fill:rgba(0,0,0,0);stroke:transparent}.plot.selected{stroke:#fff;stroke-width:1.45}
.controls{position:absolute;right:9px;bottom:11px;z-index:7;display:flex;flex-direction:column;gap:8px}.ctrl,.percent{width:49px;border-radius:13px;border:1px solid #263654;background:#0a1428ee;color:#91b4fb;box-shadow:0 8px 24px #0007}

ff;font-size:14px;text-align:center;text-shadow:0 2px 5px #000}.lightbox-close{position:fixed;right:14px;top:14px;z-index:2;width:46px;height:46px;border-radius:50%;border:1px solid #ffffff45;background:#0a1325dd;color:#fff;font-size:28px;line-height:1}

@media(max-width:700px){

  .status.expanded .status-option{transform:translateY(0);opacity:1}
  .status.expanded .status-option:nth-child(3){transition-delay:.02s}.status.expanded .status-option:nth-child(2){transition-delay:.07s}.status.expanded .status-option:nth-child(1){transition-delay:.12s}
  .bottom-links{right:51px;bottom:14px}
  .status-option,.status-option.active{background:transparent!important;box-shadow:none!important}
  .status-option{position:relative;isolation:isolate;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:none}
  .status-option>span,.status-option>b{position:relative;z-index:2}
  .status-option::before,.status-option::after{content:"";position:absolute;pointer-events:none;z-index:1;left:var(--rain-x,50%);top:var(--rain-y,50%);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.12)}
  .status-option::before{width:150px;height:150px;background:radial-gradient(circle,rgba(255,255,255,.32) 0 8%,rgba(92,181,255,.24) 20%,rgba(62,122,255,.13) 42%,transparent 68%);filter:blur(1px);transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .18s ease}
  .status-option::after{display:block!important;width:95px;height:95px;background:conic-gradient(from 45deg,transparent,rgba(255,255,255,.22),transparent 36%,rgba(58,174,255,.22),transparent 72%);filter:blur(4px);transition:transform .6s cubic-bezier(.16,1,.3,1),opacity .2s ease}
  .status-option.touch-glass::before{opacity:1;transform:translate(-50%,-50%) scale(1);animation:liquidPulse .9s ease-in-out infinite alternate}
  .status-option.touch-glass::after{opacity:.9;transform:translate(-50%,-50%) scale(1.15) rotate(50deg);animation:liquidSpin 1.25s linear infinite}
  .status-option.touch-glass{background:radial-gradient(circle at var(--rain-x,50%) var(--rain-y,50%),rgba(255,255,255,.38) 0 8%,rgba(48,166,255,.27) 24%,rgba(26,89,190,.18) 48%,transparent 72%)!important;box-shadow:inset 0 0 15px rgba(126,214,255,.28),0 0 13px rgba(59,159,255,.3)!important;transform:scale(.965)!important;text-shadow:0 0 8px currentColor,0 1px 4px #000!important;animation:liquidHold .75s ease-in-out infinite alternate}
  .status-option.active span,.status-option.active b{filter:brightness(1.35);text-shadow:0 0 9px currentColor,0 1px 4px #000}
  .status-option.active{box-shadow:inset 0 0 12px rgba(83,182,255,.16),0 0 10px rgba(61,157,255,.2)!important;animation:selectedLiquidGlow 1.7s ease-in-out infinite alternate}
  .status-option.active::before{opacity:.5;transform:translate(-50%,-50%) scale(.86);animation:liquidPulse 1.8s ease-in-out infinite alternate}
  .status-option.active::after{opacity:.42;transform:translate(-50%,-50%) scale(.92);animation:liquidSpin 3.2s linear infinite}
  .status-option.active.touch-glass::before{opacity:1;transform:translate(-50%,-50%) scale(1);animation:liquidPulse .9s ease-in-out infinite alternate}
  .status-option.active.touch-glass::after{opacity:.9;transform:translate(-50%,-50%) scale(1.15);animation:liquidSpin 1.25s linear infinite}
  .status-body .status-line.status-option:focus,.status-body .status-line.status-option:focus-visible,.status-body .status-line.status-option:active{background:transparent!important;box-shadow:none!important}
}
@keyframes liquidPulse{from{transform:translate(-50%,-50%) scale(.78);filter:blur(1px)}to{transform:translate(-50%,-50%) scale(1.12);filter:blur(3px)}}
@keyframes liquidSpin{to{transform:translate(-50%,-50%) scale(1.15) rotate(410deg)}}
@keyframes liquidHold{from{box-shadow:inset 0 0 8px rgba(126,214,255,.22),0 0 5px rgba(59,159,255,.2)}to{box-shadow:inset 0 0 22px rgba(126,214,255,.45),0 0 18px rgba(59,159,255,.46)}}
@keyframes selectedLiquidGlow{from{box-shadow:inset 0 0 7px rgba(126,214,255,.12),0 0 4px rgba(59,159,255,.12)}to{box-shadow:inset 0 0 17px rgba(126,214,255,.28),0 0 13px rgba(59,159,255,.3)}}

/* PREMIUM CLIENT UI — consistent, polished presentation */
:root{--panel-glass:rgba(7,16,32,.88);--soft-line:rgba(135,164,218,.2);--brand-glow:rgba(29,218,126,.28)}

.map-badge,.ctrl,.percent,.pill,.status-head{border-color:var(--soft-line);background:var(--panel-glass);box-shadow:inset 0 1px rgba(255,255,255,.055),0 10px 28px rgba(0,0,0,.38);backdrop-filter:blur(14px) saturate(135%);-webkit-backdrop-filter:blur(14px) saturate(135%)}

.diagram{background:linear-gradient(145deg,rgba(16,30,54,.95),rgba(8,20,38,.96));border-color:rgba(117,150,209,.25);box-shadow:inset 0 1px rgba(255,255,255,.035),0 12px 30px rgba(0,0,0,.18)}

  function normalizeQuarterTurn(value){
    const n=Number(value);

  }
  function rotateOffset(x,y,turns){
    const t=((turns%4)+4)%4;

  }

  function setMapDimensions(width,height){

  }

  function displaySize(){return publicRotation%2?{w:H,h:W}:{w:W,h:H}}
  function calcFit(){
    const mobile = window.matchMedia('(max-width:700px)').matches;

    const fw = viewport.clientWidth / size.w;

  }
  function limits(){const size=displaySize();return {x:Math.max(0,(size.w*scale-viewport.clientWidth)/2),y:Math.max(0,(size.h*scale-viewport.clientHeight)/2)}}

  function scheduleRender(){if(!mapRaf)mapRaf=requestAnimationFrame(()=>{mapRaf=0;render()})}

  function openFullImage(src,caption){lightboxImage.src=src;lightboxImage.alt=caption;lightboxCaption.textContent=caption;imageLightbox.classList.add('open');imageLightbox.setAttribute('aria-hidden','false')}

  async function openGallery(){galleryModal.classList.add('open');galleryModal.setAttribute('aria-hidden','false');clientGallery.replaceChildren(Object.assign(document.createElement('div'),{className:'gallery-state',textContent:'Loading gallery…'}));try{const response=await fetch('/api/public-data'+(window.REKIXO_PROJECT_QUERY||''),{cache:'no-store'});if(!response.ok)throw new Error();const data=await response.json(),items=Array.isArray(data.gallery)?data.gallery:[];clientGallery.replaceChildren();if(!items.length){clientGallery.append(Object.assign(document.createElement('div'),{className:'gallery-state',textContent:'Gallery me abhi koi image nahi hai.'}));return}items.forEach(item=>{const card=document.createElement('article'),thumb=document.createElement('button'),img=document.createElement('img'),label=document.createElement('b'),caption=item.caption||item.filename||'Project image';thumb.type='button';thumb.className='gallery-thumb';thumb.setAttribute('aria-label','View full size: '+caption);img.src='/api/gallery/'+encodeURIComponent(item.id)+(window.REKIXO_PROJECT_QUERY||'');img.alt=caption;img.loading='lazy';img.decoding='async';label.textContent=caption;thumb.onclick=()=>openFullImage(img.src,caption);thumb.append(img);card.append(thumb,label);clientGallery.append(card)})}catch(_){clientGallery.replaceChildren(Object.assign(document.createElement('div'),{className:'gallery-state',textContent:'Gallery load nahi hui. Dobara try karein.'}))}}

  });
  function setSelected(id){svg.querySelectorAll('.plot').forEach(el=>el.classList.toggle('selected',el.dataset.plotId===id))}
  function setLine(id,x1,y1,x2,y2){const el=q(id);el.setAttribute('x1',x1);el.setAttribute('y1',y1);el.setAttribute('x2',x2);el.setAttribute('y2',y2)}
  function diagram(p){
    const xs=p.points.map(a=>a[0]),ys=p.points.map(a=>a[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),bw=maxx-minx||1,bh=maxy-miny||1;
    const s=Math.min(165/bw,82/bh),ox=170-(minx+maxx)/2*s,oy=71-(miny+maxy)/2*s;

    const wt=q('#widthText');wt.setAttribute('x',cx);wt.setAttribute('y',widthY+20);
    const label=q('#diagramLabel');label.textContent=p.id;label.setAttribute('x',cx);label.setAttribute('y',cy+9)
  }
  function openPlot(p,focus=false){
    if(!p) return;

    q('#sqm').textContent=Number(p.sqm).toLocaleString('en-IN')+' Sq.M';
    q('#sqft').textContent=Number(p.sqft).toLocaleString('en-IN')+' Sq.Ft';
    q('#sqyd').textContent=Number(p.sqyd).toLocaleString('en-IN')+' Sq.Yd';
    q('#dims').textContent=p.dimensions||'—'; q('#road').textContent=p.road||'—';const st=plotStatus(p),statusEl=q('#plotStatusValue');statusEl.textContent=st.charAt(0).toUpperCase()+st.slice(1);statusEl.className=st;diagram(p);

    lastPlotOpenAt=performance.now();
  }
  function close(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');scrim.classList.remove('open')}
  function focusPlot(p){const target=Math.max(scale,fit*1.85);scale=Math.min(target,fit*4.5);const r=rotateOffset(p.center[0]-W/2,p.center[1]-H/2,publicRotation);pan.x=-r.x*scale;pan.y=-r.y*scale;render()}
  function zoomAt(newScale,sx,sy){newScale=clamp(newScale,fit,fit*4.5);const r=viewport.getBoundingClientRect(),mx=sx-r.left-r.width/2,my=sy-r.top-r.height/2,cx=(mx-pan.x)/scale,cy=(my-pan.y)/scale;pan.x=mx-cx*newScale;pan.y=my-cy*newScale;scale=newScale;render()}
  function zoomCenter(factor){const r=viewport.getBoundingClientRect();zoomAt(scale*factor,r.left+r.width/2,r.top+r.height/2)}
  function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
  function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}

  function pointInPolygon(x,y,pts){let inside=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi))inside=!inside}return inside}
  function distSeg(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,c1=vx*wx+vy*wy;if(c1<=0)return Math.hypot(px-ax,py-ay);const c2=vx*vx+vy*vy;if(c2<=c1)return Math.hypot(px-bx,py-by);const t=c1/c2,qx=ax+t*vx,qy=ay+t*vy;return Math.hypot(px-qx,py-qy)}
  function clientToPlan(x,y){

    // scale, centering, pan, SVG viewBox and device layout in one matrix.
    const ctm=svg.getScreenCTM?.();
    if(ctm){
      try{
        const point=svg.createSVGPoint();
        point.x=x;point.y=y;
        const local=point.matrixTransform(ctm.inverse());
        if(Number.isFinite(local.x)&&Number.isFinite(local.y))return{x:local.x,y:local.y};
      }catch(_){ }
    }
    // Conservative fallback for browsers where getScreenCTM is unavailable.
    const r=viewport.getBoundingClientRect(),dx=(x-r.left-r.width/2-pan.x)/scale,dy=(y-r.top-r.height/2-pan.y)/scale,u=rotateOffset(dx,dy,(4-publicRotation)%4);
    return{x:u.x+W/2,y:u.y+H/2};
  }
  function nativePlotAtClient(x,y){
    const target=document.elementFromPoint(x,y);
    const el=target?.closest?.('.plot');

  function plotAtClient(x,y,padCss=0){

    if(exact) return exact;
    if(padCss<=0) return null;
    const maxPlan=padCss/Math.max(scale,.01);
    let best=null,bestD=Infinity;
    for(const p of plots){
      for(let i=0;i<p.points.length;i++){
        const a=p.points[i],b=p.points[(i+1)%p.points.length],d=distSeg(pt.x,pt.y,a[0],a[1],b[0],b[1]);
        if(d<bestD){bestD=d;best=p}
      }
    }
    return bestD<=maxPlan?best:null;
  }

  function isUiTarget(target){return !!target.closest?.('.status,.controls,.bottom-links,.map-badge,.toast,.drawer,.scrim,.header')}

  viewport.addEventListener('pointerdown',e=>{

  function clearStatusFilter(){statusFilter=null;svg.classList.remove('status-filter-available','status-filter-booked','status-filter-sold');document.querySelectorAll('.status-option').forEach(b=>b.classList.remove('active'));engine3D?.setStatusFilter?.(null)}

  function toggleStatusPanel(){statusExpanded=!statusExpanded;showAll=statusExpanded;statusCard.classList.toggle('expanded',statusExpanded);q('#outlineToggle').classList.toggle('on',statusExpanded);q('#outlineToggle').setAttribute('aria-expanded',String(statusExpanded));svg.classList.toggle('show-all',showAll);engine3D?.setShowAll(showAll);if(!statusExpanded)clearStatusFilter()}

  let glassOpt=null,suppressStatusClick=false;
  function clearGlass(){if(glassOpt){glassOpt.classList.remove('touch-glass');glassOpt=null}}
  function paintGlass(e){if(!isCoarse(e))return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.status-option');if(el!==glassOpt){clearGlass();glassOpt=el||null;if(glassOpt){glassOpt.classList.add('touch-glass');setStatusFilter(glassOpt.dataset.statusFilter,true)}}if(glassOpt){const r=glassOpt.getBoundingClientRect();glassOpt.style.setProperty('--rain-x',(e.clientX-r.left)+'px');glassOpt.style.setProperty('--rain-y',(e.clientY-r.top)+'px')}}
  statusBody.addEventListener('pointerdown',e=>{if(isCoarse(e))suppressStatusClick=true;paintGlass(e)});statusBody.addEventListener('pointermove',paintGlass);statusBody.addEventListener('pointerup',()=>setTimeout(clearGlass,140));statusBody.addEventListener('pointercancel',()=>{suppressStatusClick=false;clearGlass()});statusBody.addEventListener('pointerleave',clearGlass);
  q('#outlineToggle').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggleStatusPanel()});
  q('#outlineTop').onclick=()=>{window.top.location.href=ADMIN_URL||'/admin/login'};
  document.querySelectorAll('.status-option').forEach(b=>b.addEventListener('click',e=>{if(suppressStatusClick){suppressStatusClick=false;e.preventDefault();return}setStatusFilter(b.dataset.statusFilter)}));
  updateStatusCounts();

  q('#searchForm').onsubmit=e=>{e.preventDefault();const id=norm(q('#searchInput').value),p=plots.find(x=>x.id===id);if(!p)return toast('Plot not found');if(mode3D){selected=p;setSelected(p.id);engine3D?.select(p.id,true,false);toast('Plot '+p.id+' selected')}else openPlot(p,true)};
  q('#closeBtn').onclick=close; scrim.onclick=close;
  function call(){if(!PHONE)return toast('Contact number not configured');location.href='tel:+'+PHONE}
  q('#callTop').onclick=call;q('#callBtn').onclick=call;
  q('#waBtn').onclick=()=>{if(!PHONE)return toast('WhatsApp number not configured');const place=PROJECT_LOCATION?`, ${PROJECT_LOCATION}`:'';const msg=selected?`Hello, I am interested in Plot ${selected.id} at ${PROJECT_NAME}${place}. Please share current availability, price and booking details.`:`Hello, I would like details about ${PROJECT_NAME}${place}.`;window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')};

  function hud3D(s){q('#percent').textContent=s.zoomPercent+'%';const n=document.getElementById('compassNeedle');if(n)n.setAttribute('transform',`rotate(${(-s.yaw*180/Math.PI).toFixed(1)} 32 32)`)}
  function set3D(on){
    if(on&&!PUBLIC_READY){toast('Project data load ho raha hai');return}
    if(on&&!HAS_MASTERPLAN){toast('Masterplan upload hone ke baad 3D ready hoga');return}
    mode3D=!!on; viewport.classList.toggle('mode3d',mode3D); q('#view3d').textContent=mode3D?'2D':'3D';
    pointers.clear();gesture=null;viewport.classList.remove('dragging');
    if(mode3D){
      close();
      if(!engine3D){try{engine3D=new Tiyansh3D(q('#threeHost'),{plots,imageSrc:q('.master').src,mapWidth:W,mapHeight:H,onSelect:p=>{selected=p;setSelected(p.id);openPlot(p,false)},onCamera:hud3D})}catch(e){mode3D=false;viewport.classList.remove('mode3d');q('#view3d').textContent='3D';toast('3D is not supported on this device');return}}
      engine3D.setShowAll(showAll);engine3D.setStatusFilter?.(statusFilter);engine3D.activate();if(selected)engine3D.select(selected.id,false,false);hud3D({yaw:engine3D.cam.yaw,zoomPercent:Math.round(34*engine3D.baseDistance/engine3D.cam.distance)});
    }else{
      engine3D?.deactivate();const n=document.getElementById('compassNeedle');if(n)n.removeAttribute('transform');q('#percent').textContent=Math.round(scale/fit*100)+'%';render();
    }
  }
  q('#view3d').onclick=()=>set3D(!mode3D);
  q('#galleryBtn').onclick=openGallery;q('#galleryClose').onclick=closeGallery;q('#lightboxClose').onclick=closeFullImage;galleryModal.addEventListener('click',e=>{if(e.target===galleryModal)closeGallery()});imageLightbox.addEventListener('click',e=>{if(e.target===imageLightbox||e.target.classList.contains('lightbox-figure'))closeFullImage()});document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(imageLightbox.classList.contains('open'))closeFullImage();else if(galleryModal.classList.contains('open'))closeGallery()});q('#locationBtn').onclick=()=>MAP_URL?window.open(MAP_URL,'_blank','noopener,noreferrer'):toast('Location link not configured');

  function onResize(){if(resizeRaf)return;resizeRaf=requestAnimationFrame(()=>{resizeRaf=0;if(mode3D){engine3D?.resize();return}const oldFit=fit||1,z=scale/oldFit;calcFit();scale=clamp(fit*z,fit,fit*4.5);render()})}
  window.addEventListener('resize',onResize);
  window.visualViewport?.addEventListener('resize',onResize);

  function addPlotPolygon(p){
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points',polyPoints(p));poly.setAttribute('class','plot');poly.dataset.plotId=p.id;poly.dataset.status=plotStatus(p);
    poly.setAttribute('tabindex','0');poly.setAttribute('role','button');poly.setAttribute('aria-label',`Plot ${p.id}`);
    poly.addEventListener('click',e=>{if(e.detail!==0&&coarseMQ.matches)return;e.stopPropagation();openPlot(p,false)});
    poly.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPlot(p,false)}});
    svg.appendChild(poly);
  }
  function rescaleNormalizedPlots(){
    plots.forEach(p=>{
      if(!Array.isArray(p._normalized)||p._normalized.length<3)return;
      const mapped=p._normalized.map(([x,y])=>[x*W,y*H]);
      p.points=mapped;
      p.center=[mapped.reduce((sum,v)=>sum+v[0],0)/mapped.length,mapped.reduce((sum,v)=>sum+v[1],0)/mapped.length];
      const el=svg.querySelector(`[data-plot-id="${p.id}"]`);
      if(el)el.setAttribute('points',polyPoints(p));
    });
  }
  function applyPublicData(data){
    ACTIVE_PROJECT_ID=data.projectId||(GENERIC_BOOT?'':REKIXO_DEFAULT_PROJECT);

    // public-data is the canonical tenant resolver. After it returns, every
    // project asset/gallery request follows THAT exact project id instead of
    // reusing a stale/short id from an old preview tab.
    const canonicalForward=new URLSearchParams();
    if(ACTIVE_PROJECT_ID)canonicalForward.set('projectId',ACTIVE_PROJECT_ID);
    if(data&&data.preview){
      canonicalForward.set('preview','1');
      canonicalForward.set('assetRev',String(Date.now()));
    }
    window.REKIXO_PROJECT_QUERY=canonicalForward.toString()?'?'+canonicalForward.toString():'';

    const isTiyansh=ACTIVE_PROJECT_ID===REKIXO_DEFAULT_PROJECT;
    const s=data&&data.settings||{};
    publicRotation=normalizeQuarterTurn(s.publicRotation);
    // Saved polygons stay canonical. Only the shared presentation world rotates.
    setMapDimensions(isTiyansh?1200:(s.mapWidth||1200),isTiyansh?2133:(s.mapHeight||2133));
    if(!isTiyansh){
      plots.splice(0,plots.length);
      svg.querySelectorAll('.plot').forEach(el=>el.remove());
      selected=null;setSelected('');close();
    }
    const rows=Array.isArray(data.plots)?data.plots:[];
    const live=new Map(rows.map(p=>[p.id,p]));
    rows.forEach(row=>{
      if(plots.some(p=>p.id===row.id)||!row.polygon)return;
      try{
        const normalized=JSON.parse(row.polygon);if(!Array.isArray(normalized)||normalized.length<3)return;
        const mapped=normalized.map(([x,y])=>[x*W,y*H]);
        const p={...row,_normalized:normalized,points:mapped,center:[mapped.reduce((sum,v)=>sum+v[0],0)/mapped.length,mapped.reduce((sum,v)=>sum+v[1],0)/mapped.length]};
        plots.push(p);addPlotPolygon(p);
      }catch(_){}
    });
    plots.forEach(p=>{const row=live.get(p.id);if(row){const shape={points:p.points,center:p.center,path:p.path};Object.assign(p,row,shape)}const el=svg.querySelector(`[data-plot-id="${p.id}"]`);if(el)el.dataset.status=plotStatus(p)});
    if(!isTiyansh){PHONE=String(s.whatsapp||s.phone1||'').replace(/\D/g,'');MAP_URL=s.mapUrl||''}
    else {PHONE=String(s.whatsapp||s.phone1||PHONE).replace(/\D/g,'')||PHONE;MAP_URL=s.mapUrl||MAP_URL}
    const resolvedName=String(s.projectName||data.projectName||(isTiyansh?'Tiyansh — The Prime Square':'Project')).trim()||'Project';
    const resolvedLocation=String(s.location||(isTiyansh?'Raigarh, Chhattisgarh':'')).trim();
    const resolvedAddress=String(s.address||resolvedLocation).trim();
    const words=resolvedName.split(/\s+/).filter(Boolean);
    const fallbackShort=(words.map(word=>word.charAt(0)).join('').replace(/[^A-Za-z0-9]/g,'').slice(0,3)||'PRJ').toUpperCase();
    const resolvedShort=String(s.brandShort||(isTiyansh?'TPS':fallbackShort)).slice(0,4).toUpperCase();
    const resolvedBrand=String(s.brandName||(isTiyansh?'TIYANSH':(words[0]||'PROJECT'))).trim().toUpperCase();
    PROJECT_NAME=resolvedName;PROJECT_LOCATION=resolvedLocation;ADMIN_URL=data.adminUrl||ADMIN_URL;
    document.title=PROJECT_NAME;
    const brand=document.querySelector('.brand b');if(brand)brand.textContent=PROJECT_NAME.toUpperCase();
    const small=document.querySelector('.monogram small');if(small)small.textContent=resolvedBrand;
    const mono=document.querySelector('.monogram');if(mono&&mono.firstChild)mono.firstChild.textContent=resolvedShort;
    const projectLogo=document.getElementById('projectLogo');
    if(projectLogo){
      projectLogo.alt=(resolvedBrand||PROJECT_NAME)+' logo';
      if(s.logoName){
        projectLogo.hidden=true;if(mono)mono.style.display='grid';
        const baseLogoQuery=window.REKIXO_PROJECT_QUERY||'';
        const joiner=baseLogoQuery?'&':'?';
        projectLogo.onload=()=>{projectLogo.hidden=false;if(mono)mono.style.display='none'};
        projectLogo.onerror=()=>{projectLogo.hidden=true;if(mono)mono.style.display='grid'};
        projectLogo.src='/api/project-asset/logo'+baseLogoQuery+joiner+'v='+encodeURIComponent(String(s.logoVersion||s.logoName));
      }else{
        projectLogo.removeAttribute('src');projectLogo.hidden=true;if(mono)mono.style.display='grid';
      }
    }
    const badge=document.querySelector('.mini-logo strong');if(badge)badge.textContent=resolvedShort;
    const location=document.querySelector('.brand small');if(location)location.textContent=(resolvedAddress||PROJECT_LOCATION).toUpperCase();
    const sub=document.querySelector('.dhead .sub');if(sub)sub.textContent=(resolvedAddress||PROJECT_LOCATION).toUpperCase();
    const gallerySub=document.querySelector('.gallery-head p');if(gallerySub)gallerySub.textContent=[resolvedBrand||PROJECT_NAME,PROJECT_LOCATION].filter(Boolean).join(' · ').toUpperCase();
    const master=document.querySelector('.master');
    HAS_MASTERPLAN=isTiyansh||Boolean(s.masterplanName);
    if(master){
      if(isTiyansh){master.src='masterplan.jpg';master.style.visibility='visible'}
      else if(s.masterplanName){master.src='/api/project-asset/masterplan'+(window.REKIXO_PROJECT_QUERY||'');master.style.visibility='visible'}
      else {master.removeAttribute('src');master.style.visibility='hidden'}
      master.alt=PROJECT_NAME+' masterplan';
    }
    if(/^#[0-9a-f]{6}$/i.test(s.accentColor||''))document.documentElement.style.setProperty('--gold',s.accentColor);
    document.body.dataset.template=s.template||'plots';
    updateStatusCounts();
    if(selected){const fresh=plots.find(p=>p.id===selected.id);if(fresh){selected=fresh;if(drawer.classList.contains('open')){q('#sqm').textContent=Number(fresh.sqm).toLocaleString('en-IN')+' Sq.M';q('#sqft').textContent=Number(fresh.sqft).toLocaleString('en-IN')+' Sq.Ft';q('#sqyd').textContent=Number(fresh.sqyd).toLocaleString('en-IN')+' Sq.Yd';q('#dims').textContent=fresh.dimensions||'—';q('#road').textContent=fresh.road||'—';const st=plotStatus(fresh),statusEl=q('#plotStatusValue');statusEl.textContent=st.charAt(0).toUpperCase()+st.slice(1);statusEl.className=st}}}
    let revealed=false;
    const revealProject=()=>{if(revealed)return;revealed=true;PUBLIC_READY=true;world.style.visibility='visible';reset();document.documentElement.classList.remove('rekixo-project-loading','rekixo-project-error');engine3D?.setPlots?.(plots);if(master&&HAS_MASTERPLAN&&master.src)engine3D?.setImageSrc?.(master.src);engine3D?.setShowAll(showAll);engine3D?.setStatusFilter?.(statusFilter)};
    const alignMasterAndReveal=()=>{if(revealed)return;if(!isTiyansh&&master&&master.naturalWidth>0&&master.naturalHeight>0){setMapDimensions(master.naturalWidth,master.naturalHeight);rescaleNormalizedPlots()}revealProject()};
    const masterFailed=()=>{if(revealed)return;document.documentElement.classList.remove('rekixo-project-loading');document.documentElement.classList.add('rekixo-project-error')};
    if(!isTiyansh&&master&&HAS_MASTERPLAN){master.addEventListener('load',alignMasterAndReveal,{once:true});master.addEventListener('error',masterFailed,{once:true});if(master.complete){queueMicrotask(()=>master.naturalWidth>0?alignMasterAndReveal():masterFailed())}}else revealProject();
  }
  window.TIYANSH_APPLY_PUBLIC_DATA=applyPublicData;
  reset();
  if(window.TIYANSH_PENDING_PUBLIC_DATA){applyPublicData(window.TIYANSH_PENDING_PUBLIC_DATA);delete window.TIYANSH_PENDING_PUBLIC_DATA}
  const qp=new URLSearchParams(location.search);
  if(qp.get('status')==='open'&&!statusExpanded)toggleStatusPanel();
  if(qp.get('filter')&&['available','booked','sold'].includes(qp.get('filter'))){if(!statusExpanded)toggleStatusPanel();setStatusFilter(qp.get('filter'))}
  if(qp.get('view')==='3d')setTimeout(()=>{set3D(true);const id=norm(qp.get('plot')||'');if(id&&plots.some(p=>p.id===id)){selected=plots.find(p=>p.id===id);setSelected(id);engine3D?.select(id,qp.get('focus')==='1',false)}},80);
})();
</script>
</body></html>
