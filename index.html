<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes"
  />
  <title>Tiyansh Business Hub — Interactive Master Plan</title>
  <meta
    name="description"
    content="Interactive commercial plot master plan for Tiyansh Business Hub, Raigarh."
  />
  <style>
    :root{
      --bg:#040816;
      --panel:#091127;
      --panel-2:#0d1630;
      --panel-3:rgba(7,14,32,.82);
      --line:rgba(119,145,209,.18);
      --line-2:rgba(119,145,209,.28);
      --text:#f4f7ff;
      --muted:#9cacd7;
      --accent:#2fe48a;
      --accent-2:#45f3a0;
      --danger:#ff4c67;
      --gold:#efd48a;
      --shadow:0 12px 30px rgba(0,0,0,.38);
      --radius:22px;
      --header-h:148px;
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:linear-gradient(180deg,#030610 0%,#040816 100%);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
      overscroll-behavior:none;
    }

    body{
      min-height:100vh;
      overflow:hidden;
    }

    button,input{
      font:inherit;
    }

    .app{
      min-height:100vh;
      background:
        radial-gradient(circle at top right, rgba(55,93,190,.18), transparent 24%),
        radial-gradient(circle at top left, rgba(52,163,111,.08), transparent 30%),
        linear-gradient(180deg,#030610 0%,#050917 100%);
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      padding:calc(14px + var(--safe-top)) 14px 12px;
      background:linear-gradient(180deg,rgba(3,8,20,.98),rgba(6,12,28,.96));
      border-bottom:1px solid rgba(99,124,191,.12);
      backdrop-filter:blur(12px);
      box-shadow:0 8px 24px rgba(0,0,0,.22);
    }

    .brand-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      flex:1;
    }

    .logo{
      width:64px;
      height:64px;
      border-radius:50%;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 30% 30%, #fff 0%, #f3f0ff 38%, #ddd7f0 66%, #c8c3df 100%);
      border:4px solid rgba(161,178,235,.22);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.65),
        0 8px 18px rgba(0,0,0,.3);
      color:#71366f;
      font-weight:900;
      letter-spacing:.5px;
      font-size:28px;
    }

    .brand-copy{
      min-width:0;
    }

    .brand-title{
      font-size:22px;
      line-height:1.05;
      font-weight:900;
      letter-spacing:.3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brand-sub{
      margin-top:6px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      letter-spacing:2.4px;
      text-transform:uppercase;
    }

    .top-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .iconbtn{
      width:58px;
      height:58px;
      border:1px solid rgba(103,124,183,.28);
      border-radius:18px;
      background:linear-gradient(180deg,rgba(15,26,55,.92),rgba(9,18,40,.96));
      color:#eef3ff;
      display:grid;
      place-items:center;
      cursor:pointer;
      box-shadow:var(--shadow);
      padding:0;
    }

    .iconbtn svg{
      width:26px;
      height:26px;
    }

    .search-wrap{
      display:block;
    }

    .searchbox{
      height:62px;
      border-radius:20px;
      border:1px solid rgba(86,111,177,.28);
      background:linear-gradient(180deg,rgba(9,18,40,.92),rgba(8,14,33,.95));
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 10px 0 14px;
      box-shadow:0 10px 26px rgba(0,0,0,.24);
    }

    .searchbox svg{
      width:24px;
      height:24px;
      color:#8193c8;
      flex:0 0 auto;
    }

    .searchbox input{
      flex:1;
      height:100%;
      border:none;
      outline:none;
      background:transparent;
      color:#eef3ff;
      min-width:0;
      font-size:18px;
    }

    .searchbox input::placeholder{
      color:#8696c1;
    }

    .gobtn{
      height:48px;
      min-width:70px;
      border:none;
      border-radius:16px;
      background:transparent;
      color:#85adff;
      font-size:16px;
      font-weight:900;
      letter-spacing:.5px;
      cursor:pointer;
      padding:0 14px;
    }

    .workspace{
      position:relative;
      height:calc(100vh - var(--header-h) - var(--safe-top));
      min-height:520px;
      overflow:hidden;
      background:#030611;
    }

    .mapview{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      touch-action:none;
      cursor:grab;
      perspective:1100px;
      background:#040816;
    }

    .mapview.dragging{cursor:grabbing}

    .world{
      position:absolute;
      left:50%;
      top:50%;
      width:min(92vw,880px);
      aspect-ratio:1200 / 2133;
      transform-origin:center center;
      will-change:transform;
      transition:filter .2s ease;
      user-select:none;
    }

    .world.is3d{
      filter:saturate(1.03) contrast(1.03);
    }

    .map-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
      border:none;
    }

    .overlay{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      overflow:visible;
    }

    .plot{
      fill:rgba(25,174,90,.01);
      stroke:rgba(255,255,255,0);
      stroke-width:1.2;
      vector-effect:non-scaling-stroke;
      cursor:pointer;
      transition:fill .15s,stroke .15s,filter .15s;
    }

    .plot:hover{
      fill:rgba(25,174,90,.14);
      stroke:#54ef99;
      stroke-width:1.4;
      filter:drop-shadow(0 0 2px rgba(25,174,90,.45));
    }

    .plot.selected{
      fill:rgba(25,174,90,.16);
      stroke:#44f190;
      stroke-width:1.6;
      filter:drop-shadow(0 0 3px rgba(25,174,90,.55));
    }

    .plot-label{
      font:700 18px/1 Arial, sans-serif;
      fill:#fff;
      paint-order:stroke;
      stroke:#0b1222;
      stroke-width:4px;
      pointer-events:none;
      opacity:0;
    }

    .show-hotspots .plot-label{
      opacity:.95;
    }

    .world.show-hotspots .plot{
      stroke:rgba(255,255,255,.18);
      fill:rgba(25,174,90,.03);
    }

    .left-tools,
    .right-tools,
    .bottom-center,
    .status-card{
      position:absolute;
      z-index:5;
    }

    .left-tools{
      left:16px;
      top:24px;
      display:flex;
      flex-direction:column;
      gap:12px;
      pointer-events:none;
    }

    .left-tools > *{
      pointer-events:auto;
    }

    .fab{
      width:74px;
      height:74px;
      border-radius:50%;
      border:1px solid rgba(99,122,182,.28);
      background:linear-gradient(180deg,rgba(16,29,63,.92),rgba(6,15,35,.97));
      color:#fff;
      display:grid;
      place-items:center;
      box-shadow:var(--shadow);
      cursor:pointer;
      font-weight:900;
      letter-spacing:.2px;
      padding:0;
    }

    .fab.small{
      width:64px;
      height:64px;
      border-radius:18px;
    }

    .fab svg{
      width:24px;
      height:24px;
    }

    .fab.active{
      outline:2px solid rgba(75,242,161,.45);
      box-shadow:0 0 0 4px rgba(75,242,161,.12), var(--shadow);
    }

    .status-card{
      left:16px;
      bottom:18px;
      width:150px;
      padding:14px 14px 12px;
      border-radius:22px;
      background:var(--panel-3);
      border:1px solid rgba(111,133,193,.18);
      backdrop-filter:blur(12px);
      box-shadow:var(--shadow);
    }

    .status-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:10px;
    }

    .status-title{
      font-size:13px;
      font-weight:900;
      color:#dbe6ff;
      letter-spacing:4px;
    }

    .switch{
      width:58px;
      height:34px;
      border-radius:999px;
      border:none;
      position:relative;
      cursor:pointer;
      background:rgba(98,114,158,.42);
      padding:0;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .switch::after{
      content:"";
      position:absolute;
      width:24px;
      height:24px;
      border-radius:50%;
      left:5px;
      top:5px;
      background:#fff;
      transition:transform .18s ease;
      box-shadow:0 4px 10px rgba(0,0,0,.3);
    }

    .switch.on{
      background:rgba(46,228,138,.28);
    }

    .switch.on::after{
      transform:translateX(24px);
      background:#dffff0;
    }

    .status-list{
      display:grid;
      gap:10px;
    }

    .status-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-size:17px;
    }

    .status-left{
      display:flex;
      align-items:center;
      gap:8px;
      color:#d4def9;
    }

    .status-dot{
      width:14px;
      height:14px;
      border-radius:50%;
      border:2px solid var(--accent);
      box-shadow:0 0 0 2px rgba(47,228,138,.08);
    }

    .status-value{
      font-weight:800;
      color:#dfe9ff;
    }

    .status-sub{
      margin-top:6px;
      padding-top:10px;
      border-top:1px solid rgba(124,147,204,.16);
      font-size:16px;
      display:grid;
      gap:8px;
    }

    .status-sub-row{
      display:flex;
      justify-content:space-between;
      gap:8px;
      color:#adbce5;
    }

    .status-sub-row strong{
      color:#ffffff;
    }

    .bottom-center{
      left:50%;
      bottom:26px;
      transform:translateX(-50%);
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
      pointer-events:none;
    }

    .bottom-center > *{
      pointer-events:auto;
    }

    .pill{
      min-width:152px;
      height:58px;
      border:none;
      border-radius:999px;
      padding:0 22px;
      background:linear-gradient(180deg,rgba(14,27,59,.95),rgba(5,16,38,.98));
      color:#fff;
      font-weight:800;
      font-size:18px;
      letter-spacing:.6px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      cursor:pointer;
      box-shadow:var(--shadow);
      border:1px solid rgba(107,131,192,.22);
    }

    .pill svg{
      width:20px;
      height:20px;
    }

    .right-tools{
      right:16px;
      bottom:18px;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-end;
    }

    .percent{
      min-width:74px;
      height:52px;
      padding:0 14px;
      border-radius:18px;
      background:var(--panel-3);
      border:1px solid rgba(110,131,189,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:15px;
      font-weight:900;
      box-shadow:var(--shadow);
    }

    .toast{
      position:absolute;
      left:50%;
      bottom:12px;
      transform:translateX(-50%) translateY(20px);
      opacity:0;
      z-index:12;
      padding:12px 20px;
      background:rgba(0,0,0,.74);
      color:#fff;
      border-radius:999px;
      font-size:15px;
      pointer-events:none;
      transition:.18s ease;
      white-space:nowrap;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .scrim{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.36);
      z-index:29;
      opacity:0;
      pointer-events:none;
      transition:.18s ease;
    }

    .scrim.open{
      opacity:1;
      pointer-events:auto;
    }

    .drawer{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:30;
      transform:translateY(102%);
      transition:transform .2s ease;
      background:linear-gradient(180deg,#09122a 0%, #081126 100%);
      border-top:2px solid rgba(62,226,138,.18);
      border-radius:26px 26px 0 0;
      box-shadow:0 -16px 38px rgba(0,0,0,.45);
      padding:18px 16px calc(18px + var(--safe-bottom));
      max-height:88vh;
      overflow:auto;
    }

    .drawer.open{
      transform:translateY(0);
    }

    .drawer-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .drawer-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      height:34px;
      padding:0 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      letter-spacing:1px;
      background:rgba(46,228,138,.12);
      color:var(--accent);
      border:1px solid rgba(46,228,138,.24);
      text-transform:uppercase;
    }

    .drawer-title{
      margin-top:10px;
      font-size:36px;
      line-height:1;
      font-weight:900;
      letter-spacing:.3px;
    }

    .drawer-sub{
      margin-top:8px;
      color:#7f8fb7;
      font-size:14px;
      letter-spacing:2px;
      font-weight:700;
      text-transform:uppercase;
    }

    .closebtn{
      width:44px;
      height:44px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.06);
      color:#cad4ef;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      cursor:pointer;
      border:1px solid rgba(255,255,255,.06);
    }

    .closebtn svg{
      width:18px;
      height:18px;
    }

    .shape-card{
      margin-top:10px;
      border:1px solid rgba(109,132,192,.14);
      background:rgba(255,255,255,.025);
      border-radius:20px;
      padding:10px;
    }

    .shape-svg{
      display:block;
      width:100%;
      height:auto;
    }

    .dim{
      stroke:#5f6f95;
      stroke-width:2;
      fill:none;
    }

    .dim-text{
      fill:#8997bd;
      font-size:16px;
      font-weight:700;
    }

    .shape-outline{
      fill:rgba(25,174,90,.08);
      stroke:#1fe07f;
      stroke-width:5;
      stroke-linejoin:round;
    }

    .shape-no{
      fill:#1fe07f;
      font-size:34px;
      font-weight:900;
      text-anchor:middle;
    }

    .shape-facing{
      fill:#b5c2e7;
      font-size:16px;
      font-weight:700;
      text-anchor:middle;
    }

    .stats{
      margin-top:18px;
      border-top:1px solid rgba(120,140,190,.12);
    }

    .stat-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      padding:16px 0;
      border-bottom:1px solid rgba(120,140,190,.12);
      align-items:center;
    }

    .stat-label{
      color:#8190b8;
      font-size:15px;
      font-weight:800;
      letter-spacing:1.5px;
      text-transform:uppercase;
    }

    .stat-value{
      color:#eef3ff;
      font-size:18px;
      font-weight:900;
      text-align:right;
    }

    .drawer-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:18px;
    }

    .action{
      height:62px;
      border:none;
      border-radius:18px;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      box-shadow:var(--shadow);
    }

    .action svg{
      width:22px;
      height:22px;
    }

    .action.whatsapp{
      background:#1faf4a;
      color:#fff;
    }

    .action.call{
      background:linear-gradient(180deg,#283571,#1f2b61);
      color:#cfd9ff;
      border:1px solid rgba(105,128,196,.22);
    }

    @media (max-width: 760px){
      .brand-title{
        font-size:18px;
      }
      .brand-sub{
        font-size:11px;
        letter-spacing:2px;
      }
      .logo{
        width:56px;
        height:56px;
        font-size:24px;
      }
      .iconbtn{
        width:56px;
        height:56px;
      }
      .workspace{
        height:calc(100vh - 148px - var(--safe-top));
      }
      .world{
        width:min(100vw, 880px);
      }
      .status-card{
        width:148px;
      }
      .pill{
        min-width:146px;
        height:56px;
        font-size:17px;
      }
      .drawer-title{
        font-size:32px;
      }
    }

    @media (max-width: 420px){
      .brand-title{font-size:17px}
      .searchbox input{font-size:16px}
      .status-card{width:144px; padding:12px}
      .status-row,.status-sub,.status-sub-row{font-size:15px}
      .drawer-title{font-size:30px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <div class="logo">TBS</div>
          <div class="brand-copy">
            <div class="brand-title">TIYANSH BUSINESS HUB</div>
            <div class="brand-sub">RAIGARH, CHHATTISGARH</div>
          </div>
        </div>

        <div class="top-actions">
          <button class="iconbtn" id="callTop" aria-label="Call sales">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/>
            </svg>
          </button>

          <button class="iconbtn" id="hotspotTop" aria-label="Show plot boundaries">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
          </button>
        </div>
      </div>

      <form class="search-wrap" id="searchForm">
        <div class="searchbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="Search plot number — A-12, B-03, C-02"
            autocomplete="off"
          />
          <button class="gobtn" type="submit">GO</button>
        </div>
      </form>
    </header>

    <main class="workspace">
      <div class="mapview" id="mapview">
        <div class="world" id="world">
          <img
            class="map-img"
            src="masterplan.jpg"
            alt="Tiyansh Business Hub Master Plan"
            draggable="false"
          />
          <svg class="overlay" id="overlay" viewBox="0 0 1200 2133" preserveAspectRatio="none"></svg>
        </div>

        <div class="left-tools">
          <button class="fab" id="tiltBtn" type="button" aria-pressed="false">3D</button>
        </div>

        <div class="status-card">
          <div class="status-head">
            <div class="status-title">STATUS</div>
            <button class="switch" id="hotspotSwitch" aria-pressed="false" aria-label="Toggle plot boundaries"></button>
          </div>

          <div class="status-list">
            <div class="status-row">
              <div class="status-left">
                <span class="status-dot"></span>
                <span>Plots</span>
              </div>
              <div class="status-value">28</div>
            </div>
          </div>

          <div class="status-sub">
            <div class="status-sub-row">
              <span>Availability</span>
              <strong>Enquire</strong>
            </div>
            <div class="status-sub-row">
              <span>Total</span>
              <strong>28</strong>
            </div>
          </div>
        </div>

        <div class="bottom-center">
          <button class="pill" id="galleryBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
            GALLERY
          </button>

          <button class="pill location" id="locationBtn" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/>
            </svg>
            LOCATION
          </button>
        </div>

        <div class="right-tools">
          <button class="fab small" id="zoomIn" type="button" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>

          <button class="fab small" id="zoomOut" type="button" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M5 12h14"/>
            </svg>
          </button>

          <button class="fab small" id="resetBtn" type="button" aria-label="Reset view">RST</button>
          <div class="percent" id="pct">100%</div>
        </div>

        <div class="toast" id="toast">Pinch / drag to explore</div>
      </div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <div class="drawer-chip">AVAILABLE</div>
        <div class="drawer-title" id="plotTitle">Plot A-01</div>
        <div class="drawer-sub">RAIGARH, CHHATTISGARH</div>
      </div>

      <button class="closebtn" id="closeDrawer" aria-label="Close details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="shape-card">
      <svg class="shape-svg" viewBox="0 0 320 190">
        <line class="dim" x1="70" y1="152" x2="250" y2="152"/>
        <line class="dim" x1="70" y1="145" x2="70" y2="160"/>
        <line class="dim" x1="250" y1="145" x2="250" y2="160"/>
        <text class="dim-text" id="dimBottom" x="160" y="174" text-anchor="middle">—</text>

        <line class="dim" x1="45" y1="40" x2="45" y2="132"/>
        <line class="dim" x1="38" y1="40" x2="53" y2="40"/>
        <line class="dim" x1="38" y1="132" x2="53" y2="132"/>
        <text class="dim-text" id="dimSide" x="22" y="89" text-anchor="middle" transform="rotate(-90 22 89)">—</text>

        <path class="shape-outline" id="shapePath" d="M82 55 L246 55 L246 132 L82 132 Z"/>
        <text class="shape-no" id="shapeNo" x="164" y="92">A-01</text>
        <text class="shape-facing" id="shapeFacing" x="164" y="118">Facing — confirm with sales</text>
      </svg>
    </div>

    <div class="stats">
      <div class="stat-row">
        <div class="stat-label">SQ. METERS</div>
        <div class="stat-value" id="sqm">—</div>
      </div>
      <div class="stat-row">
        <div class="stat-label">SQ. FEET</div>
        <div class="stat-value" id="sqft">—</div>
      </div>
      <div class="stat-row">
        <div class="stat-label">SQ. YARDS</div>
        <div class="stat-value" id="sqyd">—</div>
      </div>
      <div class="stat-row">
        <div class="stat-label">DIMENSIONS</div>
        <div class="stat-value" id="dimensions">—</div>
      </div>
      <div class="stat-row">
        <div class="stat-label">ROAD</div>
        <div class="stat-value" id="road">—</div>
      </div>
      <div class="stat-row">
        <div class="stat-label">STATUS</div>
        <div class="stat-value" style="color:#2fe48a;">Available</div>
      </div>
    </div>

    <div class="drawer-actions">
      <button class="action whatsapp" id="whatsappBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3h.5a8.48 8.48 0 0 1 8 8v.5Z"/>
        </svg>
        WhatsApp
      </button>

      <button class="action call" id="callBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/>
        </svg>
        Call Now
      </button>
    </div>
  </aside>

  <script>
    (() => {
      const SALES_CALL = "919009995582";
      const SALES_WA = "919009995582";

      const VIEW_W = 1200;
      const VIEW_H = 2133;
      const MIN_SCALE = 0.9;
      const MAX_SCALE = 4.5;

      const plots = [
        { id:"A-20", path:"M640 688 H771 V751 H640 Z", c:[706,720], shape:"M90 48 H230 V128 H90 Z", sqft:5600, dim:"56' × 100'", road:"40' wide CC Road" },
        { id:"A-19", path:"M640 752 H771 V816 H640 Z", c:[706,784], shape:"M90 48 H230 V128 H90 Z", sqft:5600, dim:"56' × 100'", road:"40' wide CC Road" },
        { id:"A-18", path:"M640 818 H728 V876 H640 Z", c:[684,847], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-17", path:"M640 877 H728 V936 H640 Z", c:[684,906], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-16", path:"M640 937 H728 V997 H640 Z", c:[684,967], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-15", path:"M640 998 H728 V1058 H640 Z", c:[684,1028], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-14", path:"M640 1059 H728 V1118 H640 Z", c:[684,1088], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-13", path:"M640 1119 H728 V1189 H640 Z", c:[684,1154], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },

        { id:"C-03", path:"M504 1001 H589 V1059 H504 Z", c:[547,1030], shape:"M92 48 H228 V128 H92 Z", sqft:3224, dim:"52' × 62'", road:"40' wide CC Road" },
        { id:"C-02", path:"M504 1061 H589 V1119 H504 Z", c:[547,1090], shape:"M100 48 H220 V128 H100 Z", sqft:2480, dim:"40' × 62'", road:"40' wide CC Road" },
        { id:"C-01", path:"M504 1121 H589 V1189 H504 Z", c:[547,1155], shape:"M100 48 H220 V128 H100 Z", sqft:2457, dim:"See approved layout", road:"40' wide CC Road" },

        { id:"A-10", path:"M569 1192 H648 V1288 H569 Z", c:[608,1240], shape:"M86 45 H182 V132 H86 Z", sqft:4951, dim:"See approved layout", road:"30' / 40' CC Road" },
        { id:"A-11", path:"M649 1192 H708 V1288 H649 Z", c:[678,1240], shape:"M120 45 H192 V132 H120 Z", sqft:3400, dim:"40' × 85'", road:"30' / 40' CC Road" },
        { id:"A-12", path:"M709 1192 H760 L794 1274 L775 1288 H709 Z", c:[748,1240], shape:"M120 45 H230 L210 132 H120 Z", sqft:3400, dim:"40' × 85'", road:"30' / 40' CC Road" },

        { id:"B-05", path:"M498 1281 L520 1289 L513 1320 L491 1311 Z", c:[505,1299], shape:"M152 42 L214 58 L198 136 L138 122 Z", sqft:667, dim:"See approved layout", road:"40' wide CC Road" },
        { id:"B-04", path:"M476 1324 H513 V1378 L449 1378 Z", c:[485,1351], shape:"M112 44 H228 V132 H90 Z", sqft:990, dim:"See approved layout", road:"40' wide CC Road" },
        { id:"B-03", path:"M449 1380 H513 V1437 H436 Z", c:[474,1408], shape:"M112 44 H228 V132 H84 Z", sqft:1292, dim:"See approved layout", road:"40' wide CC Road" },
        { id:"B-02", path:"M436 1439 H513 V1499 H423 Z", c:[470,1468], shape:"M112 44 H228 V132 H80 Z", sqft:1608, dim:"See approved layout", road:"40' wide CC Road" },
        { id:"B-01", path:"M424 1500 H513 V1616 H326 L300 1564 Z", c:[425,1568], shape:"M112 48 H238 V128 H90 L68 86 Z", sqft:6070, dim:"See approved layout", road:"40' wide CC Road" },

        { id:"A-09", path:"M571 1289 H698 V1349 H571 Z", c:[634,1319], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-08", path:"M571 1351 H698 V1412 H571 Z", c:[634,1382], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-07", path:"M571 1414 H698 V1475 H571 Z", c:[634,1444], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-06", path:"M571 1477 H698 V1538 H571 Z", c:[634,1507], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-05", path:"M571 1540 H698 V1601 H571 Z", c:[634,1570], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-04", path:"M571 1603 H698 V1664 H571 Z", c:[634,1633], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-03", path:"M571 1666 H698 V1727 H571 Z", c:[634,1697], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-02", path:"M571 1729 H698 V1790 H571 Z", c:[634,1759], shape:"M100 48 H220 V128 H100 Z", sqft:3400, dim:"40' × 85'", road:"40' wide CC Road" },
        { id:"A-01", path:"M571 1792 H698 V1868 H571 Z", c:[634,1830], shape:"M100 45 H220 V135 H100 Z", sqft:5440, dim:"64' × 85'", road:"40' wide CC Road" }
      ];

      const q = (s) => document.querySelector(s);
      const overlay = q("#overlay");
      const world = q("#world");
      const view = q("#mapview");
      const drawer = q("#drawer");
      const scrim = q("#scrim");
      const pct = q("#pct");
      const toast = q("#toast");

      let scale = 1;
      let ox = 0;
      let oy = 0;
      let tilt = false;
      let selected = null;
      let dragStart = null;
      let pinchStart = null;
      let toastTimer = null;

      const pointers = new Map();

      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function getBaseSize() {
        return {
          w: world.offsetWidth,
          h: world.offsetHeight
        };
      }

      function clampPan() {
        const { w, h } = getBaseSize();
        const maxX = Math.max(0, (w * scale - view.clientWidth) / 2);
        const maxY = Math.max(0, (h * scale - view.clientHeight) / 2);
        ox = clamp(ox, -maxX, maxX);
        oy = clamp(oy, -maxY, maxY);
      }

      function render() {
        clampPan();
        const rot = tilt ? " rotateX(12deg)" : "";
        world.style.transform =
          `translate(calc(-50% + ${ox}px), calc(-50% + ${oy}px)) scale(${scale})${rot}`;
        pct.textContent = Math.round(scale * 100) + "%";
      }

      function zoom(delta) {
        scale = clamp(scale + delta, MIN_SCALE, MAX_SCALE);
        render();
      }

      function resetView() {
        scale = 1;
        ox = 0;
        oy = 0;
        render();
      }

      function normPlotId(v) {
        let s = v.trim().toUpperCase().replace(/\s+/g, "").replace(/_/g, "-");
        if (/^\d{1,2}$/.test(s)) s = "A-" + s;

        if (/^A-?\d{1,2}$/.test(s)) {
          return "A-" + String(Number(s.replace(/\D/g, ""))).padStart(2, "0");
        }
        if (/^B-?\d{1,2}$/.test(s)) {
          return "B-" + String(Number(s.replace(/\D/g, ""))).padStart(2, "0");
        }
        if (/^C-?\d{1,2}$/.test(s)) {
          return "C-" + String(Number(s.replace(/\D/g, ""))).padStart(2, "0");
        }
        return s;
      }

      function focusPlot(p, targetScale) {
        const { w, h } = getBaseSize();
        scale = targetScale || (window.innerWidth < 760 ? 2.1 : 1.8);
        ox = (0.5 - p.c[0] / VIEW_W) * w * scale;
        oy = (0.5 - p.c[1] / VIEW_H) * h * scale;
        render();
      }

      function shapeForDrawer(p) {
        return p.shape || "M92 48 H228 V128 H92 Z";
      }

      function openPlot(p, focus = false) {
        selected = p;

        document.querySelectorAll(".plot").forEach((el) => {
          el.classList.toggle("selected", el.dataset.id === p.id);
        });

        if (focus) {
          focusPlot(p);
        }

        q("#plotTitle").textContent = "Plot " + p.id;
        q("#shapeNo").textContent = p.id;
        q("#shapePath").setAttribute("d", shapeForDrawer(p));
        q("#sqft").textContent = p.sqft.toLocaleString("en-IN") + " Sq.Ft";
        q("#sqm").textContent = (p.sqft * 0.092903).toFixed(1) + " Sq.M";
        q("#sqyd").textContent = (p.sqft / 9).toFixed(1) + " Sq.Yd";
        q("#dimensions").textContent = p.dim;
        q("#road").textContent = p.road;

        const m = p.dim.match(/([\d.]+)'\s*×\s*([\d.]+)'/);
        q("#dimSide").textContent = m ? m[1] + " ft" : "—";
        q("#dimBottom").textContent = m ? m[2] + " ft" : "—";
        q("#shapeFacing").textContent = "Facing — confirm with sales";

        drawer.classList.add("open");
        drawer.setAttribute("aria-hidden", "false");
        scrim.classList.add("open");
      }

      function closeDrawer() {
        drawer.classList.remove("open");
        drawer.setAttribute("aria-hidden", "true");
        scrim.classList.remove("open");
      }

      function buildPlots() {
        plots.forEach((p) => {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", p.path);
          path.setAttribute("class", "plot");
          path.dataset.id = p.id;
          path.setAttribute("tabindex", "0");
          path.setAttribute("role", "button");
          path.setAttribute("aria-label", "View details for plot " + p.id);

          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("x", p.c[0]);
          label.setAttribute("y", p.c[1] + 5);
          label.setAttribute("text-anchor", "middle");
          label.setAttribute("class", "plot-label");
          label.textContent = p.id;

          path.addEventListener("click", (e) => {
            e.stopPropagation();
            openPlot(p, false);
          });

          path.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openPlot(p, false);
            }
          });

          g.append(path, label);
          overlay.appendChild(g);
        });
      }

      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      q("#searchForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const id = normPlotId(q("#searchInput").value);
        const p = plots.find((x) => x.id === id);
        if (!p) {
          showToast("Plot not found — try A-12, B-03 or C-02");
          return;
        }
        openPlot(p, true);
      });

      q("#zoomIn").addEventListener("click", () => zoom(0.18));
      q("#zoomOut").addEventListener("click", () => zoom(-0.18));
      q("#resetBtn").addEventListener("click", resetView);

      view.addEventListener("wheel", (e) => {
        e.preventDefault();
        zoom(e.deltaY < 0 ? 0.12 : -0.12);
      }, { passive:false });

      view.addEventListener("pointerdown", (e) => {
        pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

        if (e.target.closest && e.target.closest(".plot")) return;

        if (pointers.size === 1) {
          dragStart = {
            x:e.clientX,
            y:e.clientY,
            ox,
            oy,
            pointerId:e.pointerId
          };
          pinchStart = null;
          view.classList.add("dragging");
          if (view.setPointerCapture) view.setPointerCapture(e.pointerId);
        } else if (pointers.size === 2) {
          const pts = [...pointers.values()];
          pinchStart = {
            dist: dist(pts[0], pts[1]),
            scale
          };
          dragStart = null;
          view.classList.remove("dragging");
        }
      });

      view.addEventListener("pointermove", (e) => {
        if (!pointers.has(e.pointerId)) return;

        pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

        if (pointers.size === 2) {
          const pts = [...pointers.values()];
          const d = dist(pts[0], pts[1]);
          if (!pinchStart) pinchStart = { dist:d, scale };
          scale = clamp(pinchStart.scale * (d / pinchStart.dist), MIN_SCALE, MAX_SCALE);
          render();
          return;
        }

        if (pointers.size === 1 && dragStart && dragStart.pointerId === e.pointerId) {
          ox = dragStart.ox + (e.clientX - dragStart.x);
          oy = dragStart.oy + (e.clientY - dragStart.y);
          render();
        }
      });

      function pointerDone(id) {
        pointers.delete(id);

        if (dragStart && dragStart.pointerId === id) {
          dragStart = null;
        }

        if (pointers.size < 2) {
          pinchStart = null;
        }

        if (pointers.size === 1) {
          const [pid, pt] = [...pointers.entries()][0];
          dragStart = {
            x:pt.x,
            y:pt.y,
            ox,
            oy,
            pointerId:pid
          };
          view.classList.add("dragging");
        } else {
          view.classList.remove("dragging");
        }
      }

      view.addEventListener("pointerup", (e) => pointerDone(e.pointerId));
      view.addEventListener("pointercancel", (e) => pointerDone(e.pointerId));
      view.addEventListener("pointerleave", (e) => {
        if (e.pointerType === "mouse") pointerDone(e.pointerId);
      });

      q("#tiltBtn").addEventListener("click", () => {
        tilt = !tilt;
        q("#tiltBtn").classList.toggle("active", tilt);
        q("#tiltBtn").setAttribute("aria-pressed", String(tilt));
        world.classList.toggle("is3d", tilt);
        render();
      });

      function toggleHotspots() {
        const on = !world.classList.contains("show-hotspots");
        world.classList.toggle("show-hotspots", on);
        q("#hotspotSwitch").classList.toggle("on", on);
        q("#hotspotSwitch").setAttribute("aria-pressed", String(on));
        showToast(on ? "Plot boundaries ON" : "Plot boundaries OFF");
      }

      q("#hotspotSwitch").addEventListener("click", toggleHotspots);
      q("#hotspotTop").addEventListener("click", toggleHotspots);

      q("#galleryBtn").addEventListener("click", () => {
        window.open("masterplan.jpg", "_blank", "noopener,noreferrer");
      });

      q("#locationBtn").addEventListener("click", () => {
        window.open(
          "https://www.google.com/maps/search/?api=1&query=Behind+NH-49+Kena+Pali+Road+Amlibhouna+Raigarh+Chhattisgarh",
          "_blank",
          "noopener,noreferrer"
        );
      });

      function callNow() {
        window.location.href = "tel:+" + SALES_CALL;
      }

      q("#callTop").addEventListener("click", callNow);
      q("#callBtn").addEventListener("click", callNow);

      q("#whatsappBtn").addEventListener("click", () => {
        const msg = selected
          ? `Hello, I am interested in Plot ${selected.id} at Tiyansh Business Hub, Raigarh. Please share current availability, price and booking details.`
          : "Hello, I would like details about plots at Tiyansh Business Hub, Raigarh.";

        window.open(
          "https://wa.me/" + SALES_WA + "?text=" + encodeURIComponent(msg),
          "_blank",
          "noopener,noreferrer"
        );
      });

      q("#closeDrawer").addEventListener("click", closeDrawer);
      scrim.addEventListener("click", closeDrawer);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDrawer();
      });

      buildPlots();
      render();
      showToast("Pinch / drag to explore");
    })();
  </script>
