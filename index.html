(()=>{const W=1200,H=2133,PHONE='919009995582',plots=window.TIYANSH_PLOTS||[],q=s=>document.querySelector(s),viewport=q('#viewport'),world=q('#world'),svg=q('#hotspots'),drawer=q('#drawer'),scrim=q('#scrim');let fit=1,scale=1,pan={x:0,y:0},selected=null,showAll=false,toastTimer=null;const pointers=new Map();let gesture=null;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function calcFit(){fit=Math.min(viewport.clientWidth/W,viewport.clientHeight/H);if(!isFinite(fit)||fit<=0)fit=.3}function limits(){return{x:Math.max(0,(W*scale-viewport.clientWidth)/2),y:Math.max(0,(H*scale-viewport.clientHeight)/2)}}function clampPan(){const l=limits();pan.x=clamp(pan.x,-l.x,l.x);pan.y=clamp(pan.y,-l.y,l.y)}function render(){clampPan();world.style.transform=`translate(calc(-50% + ${pan.x}px),calc(-50% + ${pan.y}px)) scale(${scale})`;q('#percent').textContent=Math.round(scale/fit*100)+'%'}function reset(){calcFit();scale=fit;pan={x:0,y:0};render()}function toast(t){const el=q('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}function norm(v){let s=v.trim().toUpperCase().replace(/\s+/g,'').replace(/_/g,'-');if(/^\d{1,2}$/.test(s))s='A-'+s;const m=s.match(/^([ABC])-?(\d{1,2})$/);return m?m[1]+'-'+String(+m[2]).padStart(2,'0'):s}function polyPoints(p){return p.points.map(x=>x.join(',')).join(' ')}plots.forEach(p=>{const poly=document.createElementNS('http://www.w3.org/2000/svg',p.path?'path':'polygon');if(p.path)poly.setAttribute('d',p.path);else poly.setAttribute('points',polyPoints(p));poly.setAttribute('class','plot');poly.dataset.plotId=p.id;poly.setAttribute('tabindex','0');poly.setAttribute('role','button');poly.addEventListener('click',e=>{e.stopPropagation();openPlot(p,false)});poly.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPlot(p,false)}});svg.appendChild(poly)});function setSelected(id){svg.querySelectorAll('.plot').forEach(el=>el.classList.toggle('selected',el.dataset.plotId===id))}function diagram(p){const xs=p.points.map(a=>a[0]),ys=p.points.map(a=>a[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),bw=maxx-minx||1,bh=maxy-miny||1,s=Math.min(210/bw,85/bh),ox=150-(minx+maxx)/2*s,oy=72-(miny+maxy)/2*s;q('#diagramPoly').setAttribute('points',p.points.map(([x,y])=>`${x*s+ox},${y*s+oy}`).join(' '));q('#diagramLabel').textContent=p.id}function openPlot(p,focus){selected=p;setSelected(p.id);if(focus)focusPlot(p);q('#plotTitle').textContent='Plot '+p.id;q('#sqm').textContent=p.sqm.toLocaleString('en-IN')+' Sq.M';q('#sqft').textContent=p.sqft.toLocaleString('en-IN')+' Sq.Ft';q('#sqyd').textContent=p.sqyd.toLocaleString('en-IN')+' Sq.Yd';q('#dims').textContent=p.dimensions;q('#road').textContent=p.road;diagram(p);drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');scrim.classList.add('open')}function close(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');scrim.classList.remove('open')}function focusPlot(p){const target=Math.max(scale,fit*1.85);scale=Math.min(target,fit*4.5);pan.x=(W/2-p.center[0])*scale;pan.y=(H/2-p.center[1])*scale;render()}function zoomAt(newScale,sx,sy){newScale=clamp(newScale,fit,fit*4.5);const r=viewport.getBoundingClientRect(),mx=sx-r.left-r.width/2,my=sy-r.top-r.height/2,cx=(mx-pan.x)/scale,cy=(my-pan.y)/scale;pan.x=mx-cx*newScale;pan.y=my-cy*newScale;scale=newScale;render()}function zoomCenter(factor){const r=viewport.getBoundingClientRect();zoomAt(scale*factor,r.left+r.width/2,r.top+r.height/2)}function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}viewport.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(e.target.closest?.('.plot'))return;viewport.setPointerCapture?.(e.pointerId);if(pointers.size===1){gesture={type:'pan',id:e.pointerId,start:{x:e.clientX,y:e.clientY},pan:{...pan}};viewport.classList.add('dragging')}else if(pointers.size===2){const[a,b]=[...pointers.values()];gesture={type:'pinch',dist:distance(a,b),scale,mid:midpoint(a,b),pan:{...pan}};viewport.classList.remove('dragging')}});viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const[a,b]=[...pointers.values()],m=midpoint(a,b);if(!gesture||gesture.type!=='pinch')gesture={type:'pinch',dist:distance(a,b),scale,mid:m,pan:{...pan}};const ns=clamp(gesture.scale*distance(a,b)/gesture.dist,fit,fit*4.5),r=viewport.getBoundingClientRect(),oldMx=gesture.mid.x-r.left-r.width/2,oldMy=gesture.mid.y-r.top-r.height/2,cx=(oldMx-gesture.pan.x)/gesture.scale,cy=(oldMy-gesture.pan.y)/gesture.scale,newMx=m.x-r.left-r.width/2,newMy=m.y-r.top-r.height/2;scale=ns;pan.x=newMx-cx*scale;pan.y=newMy-cy*scale;render()}else if(pointers.size===1&&gesture?.type==='pan'&&gesture.id===e.pointerId){pan.x=gesture.pan.x+e.clientX-gesture.start.x;pan.y=gesture.pan.y+e.clientY-gesture.start.y;render()}});function endPointer(id){pointers.delete(id);if(pointers.size===0){gesture=null;viewport.classList.remove('dragging')}else if(pointers.size===1){const[pid,a]=[...pointers.entries()][0];gesture={type:'pan',id:pid,start:{x:a.x,y:a.y},pan:{...pan}};viewport.classList.add('dragging')}}viewport.addEventListener('pointerup',e=>endPointer(e.pointerId));viewport.addEventListener('pointercancel',e=>endPointer(e.pointerId));viewport.addEventListener('wheel',e=>{e.preventDefault();zoomAt(scale*(e.deltaY<0?1.12:.89),e.clientX,e.clientY)},{passive:false});q('#zoomIn').onclick=()=>zoomCenter(1.16);q('#zoomOut').onclick=()=>zoomCenter(.86);q('#resetBtn').onclick=reset;function toggle(){showAll=!showAll;svg.classList.toggle('show-all',showAll);q('#outlineToggle').classList.toggle('on',showAll);toast(showAll?'Plot boundaries ON':'Plot boundaries OFF')}q('#outlineToggle').onclick=toggle;q('#outlineTop').onclick=toggle;q('#searchForm').onsubmit=e=>{e.preventDefault();const id=norm(q('#searchInput').value),p=plots.find(x=>x.id===id);if(!p)return toast('Plot not found');openPlot(p,true)};q('#closeBtn').onclick=close;scrim.onclick=close;function call(){location.href='tel:+'+PHONE}q('#callTop').onclick=call;q('#callBtn').onclick=call;q('#waBtn').onclick=()=>{const msg=selected?`Hello, I am interested in Plot ${selected.id} at Tiyansh The Prime Square, Raigarh. Please share current availability, price and booking details.`:'Hello, I would like details about Tiyansh The Prime Square, Raigarh.';window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')};window.addEventListener('resize',()=>{const z=scale/fit;calcFit();scale=clamp(fit*z,fit,fit*4.5);render()});reset()})();
</script></body></html>
