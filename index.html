<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#050914">
<title>Tiyansh — The Prime Square</title>
<style>
:root{
  --bg:#050914;--panel:#0b1427;--panel2:#101a30;--line:#202d47;
  --text:#f7f9ff;--muted:#6f7e9d;--muted2:#8897b8;
  --green:#18b968;--green2:#22de7d;--red:#ef334e;--amber:#f4b51f;
  --blue:#88a5ff;--safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.header{z-index:20;background:#060b17;border-bottom:1px solid #1c2840;padding:11px 17px 12px;box-shadow:0 8px 28px #0007}
.brandrow{display:flex;align-items:center;gap:14px}.brandmark{width:60px;height:60px;flex:none;border-radius:13px;background:#fff;border:1px solid #e7e7e7;display:grid;place-items:center;color:#111;box-shadow:0 0 0 2px #ffffff12}
.brandmark .monogram{width:48px;height:48px;border:2px solid #141414;border-radius:8px;display:grid;place-items:center;font-weight:950;font-size:17px;line-height:1;text-align:center}
.brandmark .monogram small{display:block;font-size:6px;letter-spacing:.08em;margin-top:2px}
.brand{min-width:0;flex:1}.brand b{display:block;font-size:20px;line-height:1.06;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:950}
.brand small{display:block;color:#8f9aba;letter-spacing:.27em;margin-top:7px;font-weight:800;font-size:11px}
.head-actions{display:flex;gap:11px}.icon{width:60px;height:60px;border:1px solid #23304a;background:#091326;color:#eef3ff;border-radius:18px;display:grid;place-items:center;font-size:23px;font-weight:900}
.icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
.search{height:62px;margin-top:12px;border:1px solid #27334a;border-radius:17px;background:#101624;display:flex;align-items:center;padding:0 9px 0 17px;gap:12px}
.search svg{width:21px;height:21px;stroke:#7687ae;fill:none;stroke-width:2}.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:white;font-size:17px;font-weight:600}
.search input::placeholder{color:#667698}.go{height:46px;border:0;background:transparent;color:#89b7ff;font-weight:950;padding:0 10px}
.map{position:relative;overflow:hidden;touch-action:none;background:#040812;cursor:grab}.map.dragging{cursor:grabbing}
.world{position:absolute;left:50%;top:50%;width:1200px;height:2133px;transform-origin:center center;will-change:transform;user-select:none}
.master,.hotspots{position:absolute;inset:0;width:1200px;height:2133px;display:block}.master{pointer-events:none;-webkit-user-drag:none}.hotspots{z-index:2;overflow:visible}
.plot{fill:rgba(32,225,125,.001);stroke:transparent;stroke-width:1.1;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .12s,stroke .12s,filter .12s}
.plot.selected{fill:rgba(18,197,104,.22);stroke:#20e47e;stroke-width:1.45;filter:drop-shadow(0 0 3px rgba(37,236,132,.75))}
.show-all .plot{fill:rgba(27,188,103,.12);stroke:rgba(29,230,126,.55);stroke-width:.9}
.map-badge{position:absolute;z-index:7;display:grid;place-items:center;border:1px solid #202b42;background:#09101ee8;box-shadow:0 9px 28px #0007;backdrop-filter:blur(7px)}
.compass{left:24px;top:24px;width:68px;height:68px;border-radius:50%}.compass svg{width:48px;height:48px}.view-mode{left:24px;top:108px;width:66px;height:66px;border-radius:50%;color:#fff;font-weight:950;font-size:16px;cursor:pointer}
.view-mode:hover{border-color:#344867}.mini-logo{right:19px;top:22px;width:44px;height:44px;border-radius:50%;background:#e9e4e8;color:#60304e;border:2px solid #84717f;font-size:8px;font-weight:950;text-align:center;line-height:1.05}
.status{position:absolute;left:10px;top:188px;bottom:auto;z-index:7;width:168px;border:1px solid #22304a;background:#081222ed;border-radius:17px;padding:11px 10px 13px;box-shadow:0 10px 30px #0008;backdrop-filter:blur(8px)}
.status-head{height:27px;display:flex;justify-content:space-between;align-items:center;color:#8eb0eb;letter-spacing:.18em;font-size:11px;font-weight:950;padding-bottom:0;transition:.2s}.status.expanded .status-head{border-bottom:1px solid #263149;padding-bottom:9px}
.toggle{width:44px;height:24px;border:0;border-radius:999px;background:#3a4256;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on{background:#2e71df}.toggle.on:after{transform:translateX(20px)}
.status-body{max-height:0;opacity:0;overflow:hidden;pointer-events:none;transition:max-height .24s ease,opacity .18s ease}.status.expanded .status-body{max-height:190px;opacity:1;pointer-events:auto}.status-line{width:100%;margin-top:12px;display:flex;justify-content:space-between;align-items:center;color:#a5b1cc;font-size:12px;font-weight:800}.status-option{appearance:none;border:0;background:transparent;padding:7px 7px;margin-left:-4px;margin-right:-4px;border-radius:9px;text-align:left;cursor:pointer;transition:background .15s,transform .12s}.status-option:active{transform:scale(.985)}.status-option.active{background:#202838}.status-option:focus-visible{outline:2px solid #7aa7ff;outline-offset:1px}
.status-line b{color:#697794;font-size:12px}.status-line.total{padding-top:10px;border-top:1px solid #263149;color:#697794}.status-line.total b{color:#ffd900;font-size:18px}.sdot{width:11px;height:11px;border:2px solid currentColor;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-1px}.available{color:#15c86d}.booked{color:#f5b716}.sold{color:#f23b56}
.status-filter-available .plot[data-status="available"]{fill:rgba(20,196,105,.28);stroke:rgba(28,239,129,.72);stroke-width:1}.status-filter-booked .plot[data-status="booked"]{fill:rgba(245,181,22,.29);stroke:rgba(255,203,44,.82);stroke-width:1}.status-filter-sold .plot[data-status="sold"]{fill:rgba(240,49,76,.30);stroke:rgba(255,70,94,.86);stroke-width:1}.status-filter-available .plot:not([data-status="available"]),.status-filter-booked .plot:not([data-status="booked"]),.status-filter-sold .plot:not([data-status="sold"]){fill:rgba(0,0,0,0);stroke:transparent}.plot.selected{stroke:#fff;stroke-width:1.45}
.controls{position:absolute;right:9px;bottom:11px;z-index:7;display:flex;flex-direction:column;gap:8px}.ctrl,.percent{width:49px;border-radius:13px;border:1px solid #263654;background:#0a1428ee;color:#91b4fb;box-shadow:0 8px 24px #0007}
.ctrl{height:49px;font-size:20px;font-weight:800}.ctrl.text{font-size:12px;color:#8592ad}.percent{height:43px;display:grid;place-items:center;font-size:12px;font-weight:950;color:#73a6ff}
.bottom-links{position:absolute;right:9px;bottom:234px;z-index:7;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pill{height:38px;padding:0 16px;border-radius:999px;border:1px solid #2b3854;background:#0a1325e8;color:#f2f5ff;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:950;letter-spacing:.06em;box-shadow:0 8px 22px #0007}.pill .pin{color:#ff4261}.pill .gallery{color:#f4c246}
.toast{position:absolute;left:50%;bottom:92px;z-index:12;transform:translateX(-50%) translateY(14px);opacity:0;background:#030711ec;border:1px solid #ffffff1c;border-radius:999px;padding:10px 15px;pointer-events:none;transition:.16s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.scrim{position:fixed;inset:0;z-index:29;background:#000a;opacity:0;pointer-events:none;transition:.18s;backdrop-filter:blur(4px)}.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:30;left:0;top:0;bottom:0;width:min(87vw,600px);overflow:auto;background:#0d172b;border-top:4px solid var(--green);padding:35px 36px calc(96px + var(--safe));transform:translateX(-103%);transition:.22s ease;box-shadow:18px 0 50px #000b}.drawer.open{transform:translateX(0)}
.dhead{display:flex;justify-content:space-between;gap:14px}.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #146b4d;border-radius:12px;background:#0e2c29;color:#20b768;font-size:12px;font-weight:950;padding:9px 15px;letter-spacing:.06em}.chip:before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.drawer h2{font-size:42px;line-height:1;margin:16px 0 9px;font-weight:950}.drawer .sub{color:#4c5972;font-weight:900;letter-spacing:.1em;font-size:13px}.close{width:48px;height:48px;border-radius:50%;border:1px solid #33415b;background:#1a2439;color:#9ba7c2;font-size:25px;flex:none}
.diagram{margin-top:28px;border:1px solid #2a354f;border-radius:17px;background:#111b31;padding:16px}.diagram svg{width:100%;height:220px;display:block}.diagram polygon{fill:#19b56812;stroke:#18b765;stroke-width:3;vector-effect:non-scaling-stroke}.dimline{stroke:#43506b;stroke-width:1.2}.dimtext{fill:#6e7892;font-size:12px}.plotnum{fill:#19bd69;font-size:26px;font-weight:950}.facts{margin-top:22px}.fact{display:flex;justify-content:space-between;gap:18px;padding:17px 0;border-bottom:1px solid #202c45}.fact span{color:#73819e;font-size:13px;font-weight:900;letter-spacing:.06em}.fact b{text-align:right;font-size:16px}.fact .enquire{color:#20c571}
.actions{position:sticky;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:32px;padding-top:20px;background:linear-gradient(180deg,transparent,#0d172b 25%)}.action{height:67px;border-radius:18px;font-weight:950;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}.action svg{width:23px;height:23px;flex:none}.wa{background:#16ad50;color:white;border:0}.wa svg{fill:currentColor}.call{background:#202d5e;color:#8798ff;border:1px solid #41518d}.call svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:560px){
  .header{padding-left:17px;padding-right:17px}.brandmark{width:60px;height:60px}.brand b{font-size:19px}.brand small{font-size:10px}
  .icon{width:60px;height:60px}.drawer{width:87vw;padding-left:36px;padding-right:36px}.drawer h2{font-size:40px}
}
@media(min-width:900px){
  .header{display:grid;grid-template-columns:minmax(380px,1fr) minmax(350px,520px);gap:24px;align-items:center}.search{margin-top:0}
  .drawer{width:560px}
}

/* MOBILE REFINEMENT — compact like the reference UI */
@media(max-width:700px){
  html,body{overflow:hidden;max-width:100vw}
  .app{width:100vw;max-width:100vw;overflow:hidden}
  .header{padding:7px 10px 9px;box-shadow:0 4px 16px #0006}
  .brandrow{gap:8px;min-width:0}
  .brandmark{width:42px;height:42px;border-radius:9px;box-shadow:none}
  .brandmark .monogram{width:34px;height:34px;border-width:1.5px;border-radius:6px;font-size:13px}
  .brandmark .monogram small{font-size:5px;margin-top:1px}
  .brand{min-width:0;overflow:hidden}
  .brand b{font-size:14px;line-height:1.05;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
  .brand small{font-size:7px;letter-spacing:.22em;margin-top:4px;white-space:nowrap}
  .head-actions{gap:6px;flex:none}
  .icon{width:42px;height:42px;border-radius:11px;padding:0}
  .icon svg{width:18px;height:18px}
  .search{height:47px;margin-top:8px;border-radius:12px;padding:0 7px 0 13px;gap:9px}
  .search svg{width:18px;height:18px;flex:none}
  .search input{font-size:13px;font-weight:700}
  .go{height:38px;font-size:11px;padding:0 7px}

  .compass{left:12px;top:12px;width:48px;height:48px}
  .compass svg{width:37px;height:37px}
  .view-mode{left:12px;top:69px;width:48px;height:48px;font-size:13px}
  .mini-logo{right:10px;top:10px;width:34px;height:34px;font-size:6px}

  /* Mobile STATUS: 20% larger, stable downward expansion, glass/touch feel */
  .status{left:8px;top:calc(100% - 228px);bottom:auto;width:149px;border-radius:14px;padding:10px 10px 11px;background:rgba(8,18,34,.72);border-color:rgba(122,167,255,.22);box-shadow:0 12px 34px #0009;backdrop-filter:blur(12px) saturate(135%);-webkit-backdrop-filter:blur(12px) saturate(135%)}
  .status-head{height:27px;font-size:9.6px;padding-bottom:0;letter-spacing:.15em}.status.expanded .status-head{padding-bottom:7px}
  .toggle{width:41px;height:23px}.toggle:after{width:18px;height:18px;left:2.5px;top:2.5px}.toggle.on:after{transform:translateX(18px)}
  .status-body{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .status-body::-webkit-scrollbar{display:none}
  .status.expanded .status-body{max-height:174px;overflow-y:auto}
  .status-line{margin-top:10px;font-size:10.8px}.status-option{position:relative;isolation:isolate;overflow:hidden;padding:7px 6px;margin-left:-4px;margin-right:-4px;border-radius:9px;transition:background .15s,transform .12s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
  .status-option::after{content:"";position:absolute;z-index:-1;left:var(--rain-x,50%);top:var(--rain-y,50%);width:78px;height:78px;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.24) 0%,rgba(126,180,255,.12) 38%,rgba(255,255,255,0) 72%);filter:blur(.2px);transition:transform .28s ease,opacity .24s ease}
  .status-option.touch-glass{background:rgba(255,255,255,.075);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 4px 14px rgba(0,0,0,.16);transform:scale(.985)}
  .status-option.touch-glass::after{transform:translate(-50%,-50%) scale(1);opacity:1}
  .status-line b{font-size:10.8px}
  .status-line.total{padding-top:8px}.status-line.total b{font-size:17px}
  .sdot{width:10px;height:10px;border-width:1.8px;margin-right:6px}

  .controls{right:7px;bottom:7px;gap:6px}
  .ctrl,.percent{width:38px;border-radius:10px}
  .ctrl{height:38px;font-size:16px}.ctrl.text{font-size:9px}.percent{height:32px;font-size:9px}

  .bottom-links{right:7px;left:auto;bottom:177px;transform:none;flex-direction:column;gap:6px;max-width:none;align-items:flex-end}
  .pill{height:31px;padding:0 10px;font-size:8px;gap:5px;white-space:nowrap}

  .toast{bottom:55px;font-size:11px;padding:8px 12px;max-width:84vw;overflow:hidden;text-overflow:ellipsis}

  .drawer{width:87vw;max-width:360px;padding:24px 20px calc(82px + var(--safe));border-top-width:3px}
  .chip{font-size:10px;padding:7px 11px;border-radius:9px}
  .drawer h2{font-size:32px;margin:13px 0 7px}
  .drawer .sub{font-size:10px;letter-spacing:.08em}
  .close{width:40px;height:40px;font-size:21px}
  .diagram{margin-top:22px;padding:10px;border-radius:14px}
  .diagram svg{height:165px}
  .facts{margin-top:16px}.fact{padding:13px 0}.fact span{font-size:10px}.fact b{font-size:13px}
  .actions{gap:9px;margin-top:24px;padding-top:16px}.action{height:54px;border-radius:14px;font-size:14px}
}
@media(max-width:390px){
  .brand b{font-size:13px}.brand small{font-size:6.5px}
  .icon{width:39px;height:39px}.brandmark{width:39px;height:39px}.brandmark .monogram{width:32px;height:32px}
  .search{height:44px}
  .bottom-links{max-width:none}
  .pill{padding:0 8px;font-size:7.5px}
}


.three-host{position:absolute;inset:0;z-index:1;display:none;overflow:hidden;background:#020610;touch-action:none}.three-host canvas{display:block;width:100%;height:100%;touch-action:none}.three-loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border:1px solid #263654;border-radius:999px;background:#071021e8;color:#a8b8dc;font-size:12px;font-weight:800;transition:opacity .2s;pointer-events:none}.map.mode3d .three-host{display:block}.map.mode3d .world{display:none}.map.mode3d{background:#020610}.map.mode3d .view-mode{border-color:#3d547c;color:#fff}

/* MOBILE PLOT DETAILS — reliable full-screen drawer */
@media(max-width:700px){
  .scrim{z-index:98}
  .drawer{
    z-index:99;
    left:0;right:0;top:0;bottom:0;
    width:100vw;max-width:none;
    height:100dvh;min-height:100vh;
    padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    transform:translate3d(-101%,0,0);
    transition:transform .24s cubic-bezier(.22,.8,.26,1);
    box-shadow:none;
  }
  .drawer.open{transform:translate3d(0,0,0)}
  .dhead{position:relative;z-index:2}
  .close{position:sticky;top:0;z-index:3}
  .actions{padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
}


/* INTERACTION STABILITY PATCH — responsive touch + pointer behavior */
.hotspots,.plot{touch-action:none;-ms-touch-action:none}
.plot{pointer-events:all;-webkit-tap-highlight-color:transparent}
.drawer{visibility:hidden;pointer-events:none}
.drawer.open{visibility:visible;pointer-events:auto}
.scrim{visibility:hidden}
.scrim.open{visibility:visible}
@media(max-width:700px){
  .map{overscroll-behavior:none}
  .drawer{width:100%;max-width:none;height:100dvh;min-height:100svh}
  .drawer.open{transform:translate3d(0,0,0)}
}

</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brandrow">
    <div class="brandmark"><div class="monogram">TPS<small>TIYANSH</small></div></div>
    <div class="brand"><b>TIYANSH — THE PRIME SQUARE</b><small>RAIGARH, CHHATTISGARH</small></div>
    <div class="head-actions">
      <button class="icon" id="callTop" aria-label="Call">
        <svg viewBox="0 0 24 24"><path d="M7.2 3.5 4.6 5.3c-.8.6-.9 1.8-.4 3 2.2 5.4 6.1 9.3 11.5 11.5 1.2.5 2.4.4 3-.4l1.8-2.6-4-3-1.8 1.8c-2.6-1.1-5.2-3.7-6.3-6.3l1.8-1.8-3-4Z"/></svg>
      </button>
      <button class="icon" id="outlineTop" aria-label="Toggle plot outlines">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
      </button>
    </div>
  </div>
  <form class="search" id="searchForm">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.2 16.2 4 4"/></svg>
    <input id="searchInput" placeholder="Search plot number" autocomplete="off">
    <button class="go">GO</button>
  </form>
</header>

<main class="map" id="viewport">
  <div class="three-host" id="threeHost"></div>
  <div class="world" id="world">
    <img class="master" src="masterplan.jpg" width="1200" height="2133" alt="Tiyansh masterplan">
    <svg class="hotspots" id="hotspots" viewBox="0 0 1200 2133" width="1200" height="2133" aria-label="Interactive plot overlay"></svg>
  </div>

  <div class="map-badge compass" aria-hidden="true">
    <svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="26" fill="#0b1322" stroke="#2b3447"/>
      <g id="compassNeedle"><path d="M32 9 38 31 32 27 26 31Z" fill="#e43143"/><path d="M32 55 26 33 32 37 38 33Z" fill="#f5f7fb"/></g>
      <text x="32" y="8" text-anchor="middle" fill="#e9edf5" font-size="7" font-weight="700">N</text>
      <text x="32" y="62" text-anchor="middle" fill="#e9edf5" font-size="7" font-weight="700">S</text>
      <text x="4" y="35" fill="#e9edf5" font-size="7" font-weight="700">W</text>
      <text x="56" y="35" fill="#e9edf5" font-size="7" font-weight="700">E</text>
    </svg>
  </div>
  <button class="map-badge view-mode" id="view3d">3D</button>
  <div class="map-badge mini-logo">TPS<br>3D</div>

  <div class="status" id="statusCard">
    <div class="status-head"><span>STATUS</span><button type="button" class="toggle" id="outlineToggle" aria-label="Expand status filters" aria-expanded="false"></button></div>
    <div class="status-body" id="statusBody">
      <button type="button" class="status-line status-option available" data-status-filter="available"><span><i class="sdot"></i>Available</span><b id="countAvailable">0</b></button>
      <button type="button" class="status-line status-option booked" data-status-filter="booked"><span><i class="sdot"></i>Booked</span><b id="countBooked">0</b></button>
      <button type="button" class="status-line status-option sold" data-status-filter="sold"><span><i class="sdot"></i>Sold</span><b id="countSold">0</b></button>
      <div class="status-line total"><span>Total</span><b id="countTotal">0</b></div>
    </div>
  </div>

  <div class="bottom-links">
    <button class="pill" id="galleryBtn"><span class="gallery">▣</span> GALLERY</button>
    <button class="pill" id="locationBtn"><span class="pin">●</span> LOCATION</button>
  </div>

  <div class="controls">
    <button class="ctrl" id="zoomIn">+</button>
    <button class="ctrl" id="zoomOut">−</button>

  <div class="diagram">

      <line class="dimline" x1="52" y1="45" x2="52" y2="145"/><line class="dimline" x1="45" y1="45" x2="59" y2="45"/><line class="dimline" x1="45" y1="145" x2="59" y2="145"/>
      <text class="dimtext" x="36" y="101" transform="rotate(-90 36 101)" text-anchor="middle">Plot depth</text>
      <line class="dimline" x1="82" y1="164" x2="250" y2="164"/><line class="dimline" x1="82" y1="157" x2="82" y2="171"/><line class="dimline" x1="250" y1="157" x2="250" y2="171"/>

  <div class="actions">
    <button class="action wa" id="waBtn" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.25a9.3 9.3 0 0 0-7.96 14.12L2.7 21.25l5-1.31A9.3 9.3 0 1 0 12 2.25Zm0 16.9a7.53 7.53 0 0 1-3.84-1.05l-.28-.16-2.97.78.79-2.89-.18-.3A7.55 7.55 0 1 1 12 19.15Zm4.16-5.64c-.23-.11-1.35-.66-1.56-.74-.21-.08-.36-.11-.51.11-.15.23-.59.74-.72.89-.13.15-.27.17-.49.06-.23-.11-.96-.35-1.82-1.12-.67-.6-1.13-1.35-1.26-1.58-.13-.23-.01-.35.1-.46.1-.1.23-.27.34-.4.11-.13.15-.23.23-.38.08-.15.04-.28-.02-.4-.06-.11-.51-1.23-.7-1.69-.18-.44-.37-.38-.51-.39h-.43c-.15 0-.4.06-.61.28-.21.23-.8.78-.8 1.9s.82 2.21.93 2.36c.11.15 1.6 2.45 3.89 3.44.54.23.97.37 1.3.48.55.17 1.04.15 1.43.09.44-.07 1.35-.55 1.54-1.08.19-.53.19-.98.13-1.08-.06-.09-.21-.15-.44-.26Z"/></svg><span>WhatsApp</span></button>

<script src="plots-data.js"></script>
<script src="three-view.js"></script>
<script>
(() => {
  'use strict';

  const W = 1200, H = 2133, PHONE = '919009995582';
  const plots = Array.isArray(window.TIYANSH_PLOTS) ? window.TIYANSH_PLOTS : [];
  const q = s => document.querySelector(s);
  const viewport = q('#viewport');
  const world = q('#world');
  const svg = q('#hotspots');
  const drawer = q('#drawer');
  const scrim = q('#scrim');
  const statusCard = q('#statusCard');
  const statusBody = q('#statusBody');

  let fit = 1, scale = 1, pan = {x:0,y:0};
  let selected = null, showAll = false, statusExpanded = false, statusFilter = null;
  let toastTimer = null, mode3D = false, engine3D = null;
  let gesture = null;
  const pointers = new Map();
  let lastPlotOpenAt = 0;

  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const coarseMQ = window.matchMedia('(pointer:coarse)');
  const isCoarse = e => e?.pointerType === 'touch' || coarseMQ.matches;
  const TAP_SLOP = e => isCoarse(e) ? 14 : 6;
  const HIT_PAD = e => isCoarse(e) ? 12 : 3; // CSS px, only for edge forgiveness

  function calcFit(){
    const mobile = window.matchMedia('(max-width:700px)').matches;
    const fw = viewport.clientWidth / W;
    const fh = viewport.clientHeight / H;
    fit = mobile ? fw : Math.min(fw,fh);
    if(!Number.isFinite(fit) || fit <= 0) fit = .3;
  }
  function limits(){return {x:Math.max(0,(W*scale-viewport.clientWidth)/2),y:Math.max(0,(H*scale-viewport.clientHeight)/2)}}
  function clampPan(){const l=limits();pan.x=clamp(pan.x,-l.x,l.x);pan.y=clamp(pan.y,-l.y,l.y)}
  function render(){
    clampPan();
    world.style.transform = `translate(calc(-50% + ${pan.x}px),calc(-50% + ${pan.y}px)) scale(${scale})`;
    q('#percent').textContent = Math.round(scale/fit*100)+'%';
  }
  function reset(){calcFit();scale=fit;pan={x:0,y:0};render()}
  function toast(t){const el=q('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
  function norm(v){let s=v.trim().toUpperCase().replace(/\s+/g,'').replace(/_/g,'-');if(/^\d{1,2}$/.test(s))s='A-'+s;const m=s.match(/^([ABC])-?(\d{1,2})$/);return m?m[1]+'-'+String(+m[2]).padStart(2,'0'):s}
  function plotStatus(p){const s=String(p?.status||'available').toLowerCase();return s==='enquire'?'available':(s==='booked'?'booked':(s==='sold'?'sold':'available'))}
  function updateStatusCounts(){const c={available:0,booked:0,sold:0};plots.forEach(p=>c[plotStatus(p)]++);q('#countAvailable').textContent=c.available;q('#countBooked').textContent=c.booked;q('#countSold').textContent=c.sold;q('#countTotal').textContent=plots.length}
  function polyPoints(p){return p.points.map(x=>x.join(',')).join(' ')}

  // SVG is visual/keyboard hit-area only. Touch selection is resolved from plot geometry below.
  plots.forEach(p=>{
    const poly=document.createElementNS('http://www.w3.org/2000/svg',p.path?'path':'polygon');
    if(p.path) poly.setAttribute('d',p.path); else poly.setAttribute('points',polyPoints(p));
    poly.setAttribute('class','plot'); poly.dataset.plotId=p.id; poly.dataset.status=plotStatus(p);
    poly.setAttribute('tabindex','0'); poly.setAttribute('role','button'); poly.setAttribute('aria-label',`Plot ${p.id}`);
    poly.addEventListener('click',e=>{
      // Native mouse click fallback. Touch is handled once, centrally, on pointer-up.
      if(e.detail !== 0 && coarseMQ.matches) return;
      e.stopPropagation(); openPlot(p,false);
    });
    poly.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPlot(p,false)}});
    svg.appendChild(poly);
  });

  function setSelected(id){svg.querySelectorAll('.plot').forEach(el=>el.classList.toggle('selected',el.dataset.plotId===id))}
  function diagram(p){const xs=p.points.map(a=>a[0]),ys=p.points.map(a=>a[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),bw=maxx-minx||1,bh=maxy-miny||1,s=Math.min(210/bw,85/bh),ox=150-(minx+maxx)/2*s,oy=72-(miny+maxy)/2*s;q('#diagramPoly').setAttribute('points',p.points.map(([x,y])=>`${x*s+ox},${y*s+oy}`).join(' '));q('#diagramLabel').textContent=p.id}
  function openPlot(p,focus=false){
    if(!p) return;
    selected=p; setSelected(p.id); if(focus) focusPlot(p);
    q('#plotTitle').textContent='Plot '+p.id;
    q('#sqm').textContent=Number(p.sqm).toLocaleString('en-IN')+' Sq.M';
    q('#sqft').textContent=Number(p.sqft).toLocaleString('en-IN')+' Sq.Ft';
    q('#sqyd').textContent=Number(p.sqyd).toLocaleString('en-IN')+' Sq.Yd';
    q('#dims').textContent=p.dimensions||'—'; q('#road').textContent=p.road||'—'; diagram(p);
    drawer.scrollTop=0; drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false'); scrim.classList.add('open');
    lastPlotOpenAt=performance.now();
  }
  function close(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');scrim.classList.remove('open')}
  function focusPlot(p){const target=Math.max(scale,fit*1.85);scale=Math.min(target,fit*4.5);pan.x=(W/2-p.center[0])*scale;pan.y=(H/2-p.center[1])*scale;render()}
  function zoomAt(newScale,sx,sy){newScale=clamp(newScale,fit,fit*4.5);const r=viewport.getBoundingClientRect(),mx=sx-r.left-r.width/2,my=sy-r.top-r.height/2,cx=(mx-pan.x)/scale,cy=(my-pan.y)/scale;pan.x=mx-cx*newScale;pan.y=my-cy*newScale;scale=newScale;render()}
  function zoomCenter(factor){const r=viewport.getBoundingClientRect();zoomAt(scale*factor,r.left+r.width/2,r.top+r.height/2)}
  function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
  function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}

  function pointInPolygon(x,y,pts){let inside=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi))inside=!inside}return inside}
  function distSeg(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,c1=vx*wx+vy*wy;if(c1<=0)return Math.hypot(px-ax,py-ay);const c2=vx*vx+vy*vy;if(c2<=c1)return Math.hypot(px-bx,py-by);const t=c1/c2,qx=ax+t*vx,qy=ay+t*vy;return Math.hypot(px-qx,py-qy)}
  function clientToPlan(x,y){const r=viewport.getBoundingClientRect();return{x:(x-r.left-r.width/2-pan.x)/scale+W/2,y:(y-r.top-r.height/2-pan.y)/scale+H/2}}
  function plotAtClient(x,y,padCss=0){
    const pt=clientToPlan(x,y);
    const exact=plots.find(p=>pointInPolygon(pt.x,pt.y,p.points));
    if(exact) return exact;
    if(padCss<=0) return null;
    const maxPlan=padCss/Math.max(scale,.01);
    let best=null,bestD=Infinity;
    for(const p of plots){
      for(let i=0;i<p.points.length;i++){
        const a=p.points[i],b=p.points[(i+1)%p.points.length],d=distSeg(pt.x,pt.y,a[0],a[1],b[0],b[1]);
        if(d<bestD){bestD=d;best=p}
      }
    }
    return bestD<=maxPlan?best:null;
  }

  function isUiTarget(target){return !!target.closest?.('.status,.controls,.bottom-links,.map-badge,.toast,.drawer,.scrim,.header')}

  viewport.addEventListener('pointerdown',e=>{
    if(mode3D || isUiTarget(e.target)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
    if(pointers.size===1){
      const hit=plotAtClient(e.clientX,e.clientY,HIT_PAD(e));
      gesture={type:'single',id:e.pointerId,start:{x:e.clientX,y:e.clientY},last:{x:e.clientX,y:e.clientY},pan:{...pan},startPlot:hit?.id||null,moved:false,slop:TAP_SLOP(e),pointerType:e.pointerType};
    }else if(pointers.size===2){
      const [a,b]=[...pointers.values()];
      gesture={type:'pinch',dist:Math.max(8,distance(a,b)),scale,mid:midpoint(a,b),pan:{...pan},moved:true};
      viewport.classList.add('dragging');
    }
  },{passive:true});

  viewport.addEventListener('pointermove',e=>{
    if(mode3D || !pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
    if(pointers.size===2){
      const [a,b]=[...pointers.values()],m=midpoint(a,b);
      if(!gesture||gesture.type!=='pinch')gesture={type:'pinch',dist:Math.max(8,distance(a,b)),scale,mid:m,pan:{...pan},moved:true};
      const ns=clamp(gesture.scale*distance(a,b)/gesture.dist,fit,fit*4.5),r=viewport.getBoundingClientRect(),oldMx=gesture.mid.x-r.left-r.width/2,oldMy=gesture.mid.y-r.top-r.height/2,cx=(oldMx-gesture.pan.x)/gesture.scale,cy=(oldMy-gesture.pan.y)/gesture.scale,newMx=m.x-r.left-r.width/2,newMy=m.y-r.top-r.height/2;
      scale=ns;pan.x=newMx-cx*scale;pan.y=newMy-cy*scale;render();
      return;
    }
    if(pointers.size===1&&gesture?.type==='single'&&gesture.id===e.pointerId){
      gesture.last={x:e.clientX,y:e.clientY};
      const dx=e.clientX-gesture.start.x,dy=e.clientY-gesture.start.y,d=Math.hypot(dx,dy);
      if(!gesture.moved&&d<=gesture.slop) return; // don't move map during finger jitter
      if(!gesture.moved){
        gesture.moved=true; viewport.classList.add('dragging');
        try{viewport.setPointerCapture(e.pointerId)}catch(_){ }
      }
      pan.x=gesture.pan.x+dx;pan.y=gesture.pan.y+dy;render();
    }
  },{passive:true});

  function finishPointer(e,cancelled=false){
    const g=gesture;
    const single=pointers.size===1&&g?.type==='single'&&g.id===e.pointerId;
    const wasTap=single&&!g.moved&&!cancelled;
    let hit=null;
    if(wasTap){
      // Prefer release point, then press point. This survives SVG retargeting/pointer capture quirks.
      hit=plotAtClient(e.clientX,e.clientY,HIT_PAD(e)) || (g.startPlot?plots.find(p=>p.id===g.startPlot):null);
    }
    pointers.delete(e.pointerId);
    try{if(viewport.hasPointerCapture?.(e.pointerId))viewport.releasePointerCapture(e.pointerId)}catch(_){ }
    if(pointers.size===0){gesture=null;viewport.classList.remove('dragging')}
    else if(pointers.size===1){const [id,p]=[...pointers.entries()][0];gesture={type:'single',id,start:{x:p.x,y:p.y},last:{x:p.x,y:p.y},pan:{...pan},startPlot:null,moved:true,slop:14,pointerType:p.type};}
    if(hit) openPlot(hit,false);
  }
  viewport.addEventListener('pointerup',e=>{if(!mode3D)finishPointer(e,false)},{passive:true});
  viewport.addEventListener('pointercancel',e=>{if(!mode3D)finishPointer(e,true)},{passive:true});
  viewport.addEventListener('lostpointercapture',e=>{if(pointers.has(e.pointerId)&&pointers.size===1&&gesture?.moved){pointers.delete(e.pointerId);gesture=null;viewport.classList.remove('dragging')}});

  viewport.addEventListener('wheel',e=>{if(mode3D)return;e.preventDefault();zoomAt(scale*(e.deltaY<0?1.12:.89),e.clientX,e.clientY)},{passive:false});
  q('#zoomIn').onclick=()=>mode3D?engine3D?.zoom(.88):zoomCenter(1.16);
  q('#zoomOut').onclick=()=>mode3D?engine3D?.zoom(1.14):zoomCenter(.86);
  q('#resetBtn').onclick=()=>mode3D?engine3D?.reset():reset();

  function clearStatusFilter(){statusFilter=null;svg.classList.remove('status-filter-available','status-filter-booked','status-filter-sold');document.querySelectorAll('.status-option').forEach(b=>b.classList.remove('active'));engine3D?.setStatusFilter?.(null)}
  function setStatusFilter(st){st=st||null;if(statusFilter===st){clearStatusFilter();toast('Status filter cleared');return}statusFilter=st;svg.classList.remove('status-filter-available','status-filter-booked','status-filter-sold');if(st)svg.classList.add('status-filter-'+st);document.querySelectorAll('.status-option').forEach(b=>b.classList.toggle('active',b.dataset.statusFilter===st));engine3D?.setStatusFilter?.(st);toast(st?st.charAt(0).toUpperCase()+st.slice(1)+' plots':'Status filter cleared')}
  function toggleStatusPanel(){statusExpanded=!statusExpanded;statusCard.classList.toggle('expanded',statusExpanded);q('#outlineToggle').classList.toggle('on',statusExpanded);q('#outlineToggle').setAttribute('aria-expanded',String(statusExpanded));if(!statusExpanded)clearStatusFilter()}
  function toggleBoundaries(){showAll=!showAll;svg.classList.toggle('show-all',showAll);engine3D?.setShowAll(showAll);toast(showAll?'Plot boundaries ON':'Plot boundaries OFF')}

  // Keep status gestures isolated from the map; retain glass finger-follow effect.
  ['pointerdown','pointermove','pointerup','pointercancel'].forEach(type=>statusCard.addEventListener(type,e=>e.stopPropagation()));
  let glassOpt=null;
  function clearGlass(){if(glassOpt){glassOpt.classList.remove('touch-glass');glassOpt=null}}
  function paintGlass(e){if(!isCoarse(e))return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.status-option');if(el!==glassOpt){clearGlass();glassOpt=el||null;if(glassOpt)glassOpt.classList.add('touch-glass')}if(glassOpt){const r=glassOpt.getBoundingClientRect();glassOpt.style.setProperty('--rain-x',(e.clientX-r.left)+'px');glassOpt.style.setProperty('--rain-y',(e.clientY-r.top)+'px')}}
  statusBody.addEventListener('pointerdown',paintGlass);statusBody.addEventListener('pointermove',paintGlass);statusBody.addEventListener('pointerup',()=>setTimeout(clearGlass,90));statusBody.addEventListener('pointercancel',clearGlass);statusBody.addEventListener('pointerleave',clearGlass);
  q('#outlineToggle').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggleStatusPanel()});
  q('#outlineTop').onclick=toggleBoundaries;
  document.querySelectorAll('.status-option').forEach(b=>b.addEventListener('click',()=>setStatusFilter(b.dataset.statusFilter)));
  updateStatusCounts();

  q('#searchForm').onsubmit=e=>{e.preventDefault();const id=norm(q('#searchInput').value),p=plots.find(x=>x.id===id);if(!p)return toast('Plot not found');if(mode3D){selected=p;setSelected(p.id);engine3D?.select(p.id,true,false);toast('Plot '+p.id+' selected')}else openPlot(p,true)};
  q('#closeBtn').onclick=close; scrim.onclick=close;
  function call(){location.href='tel:+'+PHONE}
  q('#callTop').onclick=call;q('#callBtn').onclick=call;
  q('#waBtn').onclick=()=>{const msg=selected?`Hello, I am interested in Plot ${selected.id} at Tiyansh The Prime Square, Raigarh. Please share current availability, price and booking details.`:'Hello, I would like details about Tiyansh The Prime Square, Raigarh.';window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')};

  function hud3D(s){q('#percent').textContent=s.zoomPercent+'%';const n=document.getElementById('compassNeedle');if(n)n.setAttribute('transform',`rotate(${(-s.yaw*180/Math.PI).toFixed(1)} 32 32)`)}
  function set3D(on){
    mode3D=!!on; viewport.classList.toggle('mode3d',mode3D); q('#view3d').textContent=mode3D?'2D':'3D';
    pointers.clear();gesture=null;viewport.classList.remove('dragging');
    if(mode3D){
      close();
      if(!engine3D){try{engine3D=new Tiyansh3D(q('#threeHost'),{plots,onSelect:p=>{selected=p;setSelected(p.id);openPlot(p,false)},onCamera:hud3D})}catch(e){mode3D=false;viewport.classList.remove('mode3d');q('#view3d').textContent='3D';toast('3D is not supported on this device');return}}
      engine3D.setShowAll(showAll);engine3D.setStatusFilter?.(statusFilter);engine3D.activate();if(selected)engine3D.select(selected.id,false,false);hud3D({yaw:engine3D.cam.yaw,zoomPercent:Math.round(34*engine3D.baseDistance/engine3D.cam.distance)});
    }else{
      engine3D?.deactivate();const n=document.getElementById('compassNeedle');if(n)n.removeAttribute('transform');q('#percent').textContent=Math.round(scale/fit*100)+'%';render();
    }
  }
  q('#view3d').onclick=()=>set3D(!mode3D);
  q('#galleryBtn').onclick=()=>toast('Gallery');q('#locationBtn').onclick=()=>window.open('https://maps.app.goo.gl/n9BjoY4BYzZfmqTL7','_blank','noopener,noreferrer');

  function onResize(){
    if(mode3D){engine3D?.resize();return}
    const oldFit=fit||1,z=scale/oldFit;calcFit();scale=clamp(fit*z,fit,fit*4.5);render();
  }
  window.addEventListener('resize',onResize);
  window.visualViewport?.addEventListener('resize',onResize);

  reset();
  const qp=new URLSearchParams(location.search);
  if(qp.get('status')==='open'&&!statusExpanded)toggleStatusPanel();
  if(qp.get('filter')&&['available','booked','sold'].includes(qp.get('filter'))){if(!statusExpanded)toggleStatusPanel();setStatusFilter(qp.get('filter'))}
  if(qp.get('view')==='3d')setTimeout(()=>{set3D(true);const id=norm(qp.get('plot')||'');if(id&&plots.some(p=>p.id===id)){selected=plots.find(p=>p.id===id);setSelected(id);engine3D?.select(id,qp.get('focus')==='1',false)}},80);
})();
</script>
