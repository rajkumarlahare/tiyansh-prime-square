<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes" />
<meta name="theme-color" content="#11140d" />
<title>Tiyansh — The Prime Square</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#11140d;color:#f5f0d8;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
header{height:74px;background:#11140d;border-bottom:1px solid #2f3428;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 12px;position:relative;z-index:10}
header strong{display:block;color:#e8c96b;letter-spacing:.08em;font-size:20px;line-height:1.2}header span{display:block;color:#d6d2c7;font-size:14px;margin-top:4px}
.viewer{position:absolute;inset:74px 0 0 0;background:#11140d;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}
.world{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);transform-origin:center center;will-change:transform}
.world img{display:block;max-height:calc(100vh - 86px);max-width:100vw;width:auto;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.controls{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;z-index:20}.controls button{width:44px;height:44px;border-radius:50%;border:1px solid #4b5342;background:rgba(17,20,13,.92);color:#fff;font-size:22px;font-weight:700}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#050705dd;border:1px solid #353b30;color:#fff;padding:9px 13px;border-radius:999px;font-size:13px;z-index:15;pointer-events:none}
@media(max-width:700px){header{height:88px}header strong{font-size:17px}.viewer{inset:88px 0 0 0}.world img{max-height:calc(100vh - 96px)}.controls{bottom:60px}}
</style>
</head>
<body>
<header><div><strong>TIYANSH — THE PRIME SQUARE</strong><span>Commercial Plots · Raigarh</span></div></header>
<div class="viewer" id="viewer">
  <div class="world" id="world"><img src="masterplan.jpg" alt="Tiyansh The Prime Square Master Plan" /></div>
  <div class="controls"><button id="minus">−</button><button id="reset">↺</button><button id="plus">+</button></div>
  <div class="hint">Pinch / drag to explore</div>
</div>
<script>
const viewer=document.getElementById('viewer'),world=document.getElementById('world');let scale=1,ox=0,oy=0,drag=false,sx=0,sy=0,sox=0,soy=0,pinch=null;
function render(){world.style.transform=`translate(calc(-50% + ${ox}px),calc(-50% + ${oy}px)) scale(${scale})`}
function zoom(delta){scale=Math.max(.7,Math.min(5,scale+delta));render()}
viewer.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.15:-.15)},{passive:false});
viewer.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;sox=ox;soy=oy;viewer.setPointerCapture?.(e.pointerId)});
viewer.addEventListener('pointermove',e=>{if(!drag)return;ox=sox+(e.clientX-sx);oy=soy+(e.clientY-sy);render()});
viewer.addEventListener('pointerup',()=>drag=false);viewer.addEventListener('pointercancel',()=>drag=false);
viewer.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s:scale}}},{passive:false});
viewer.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();const a=e.touches[0],b=e.touches[1];scale=Math.max(.7,Math.min(5,pinch.s*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d));render()}},{passive:false});
viewer.addEventListener('touchend',()=>pinch=null);
document.getElementById('plus').onclick=()=>zoom(.2);document.getElementById('minus').onclick=()=>zoom(-.2);document.getElementById('reset').onclick=()=>{scale=1;ox=0;oy=0;render()};render();
</script>
</body>
</html>
